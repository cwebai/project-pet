/* ============================================================
   ДАННЫЕ ИЗ ПОДКЛЮЧЁННЫХ СЕРВИСОВ — Метрика, Вебмастер, Search Console, Топвизор.
   В демо цифры считаются от прогресса проекта (XP), в продукте приходят по API.
   ============================================================ */

const SOURCES = {
  metrika:  { name:'Яндекс Метрика',        letter:'М', color:'#FF5A36', what:'трафик и заявки',        sync:'Обновляется каждый день, данные по вчерашний день' },
  webmaster:{ name:'Яндекс Вебмастер',      letter:'В', color:'#E8A820', what:'поиск Яндекса',           sync:'Обновляется каждый день, задержка Яндекса — 1–2 дня' },
  gsc:      { name:'Google Search Console', letter:'G', color:'#3A7AD8', what:'поиск Google',            sync:'Обновляется каждый день, задержка Google — 2–3 дня' },
  topvisor: { name:'Топвизор',              letter:'Т', color:'#35A86A', what:'позиции по ядру запросов', sync:'Съём позиций каждый понедельник в 06:00' }
};
const CORE_SIZE = 350;   /* запросов в семантическом ядре, по которым Топвизор снимает позиции */

function anaAt(xp){
  const p = Math.min(1, xp / 2400);
  const visits = 4200 + xp * 6;
  const gShows = Math.round(61000 + xp * 52);
  return {
    visits: visits,
    leads: 38 + Math.round(xp / 14),
    conv: +((38 + xp / 14) / visits * 100).toFixed(2),
    bounce: +(31.4 - p * 7.2).toFixed(1),
    yaClicks: Math.round(visits * .64),
    yaShows: Math.round(88000 + xp * 71),
    yaPos: +(17.8 - p * 8.9).toFixed(1),
    iks: 110 + Math.round(p * 9) * 10,
    pages: 1840 + Math.round(p * 260),
    gClicks: Math.round(visits * .27),
    gShows: gShows,
    gCtr: +(visits * .27 / gShows * 100).toFixed(1),
    gPos: +(21.3 - p * 9.6).toFixed(1),
    top3: Math.round(CORE_SIZE * (.05 + p * .17)),
    top10: Math.round(CORE_SIZE * (.21 + p * .33)),
    top30: Math.round(CORE_SIZE * (.49 + p * .3)),
    vis: 34 + Math.min(40, Math.round(xp / 30))
  };
}

/* сейчас и месяц назад: «месяц назад» — на 260 XP раньше, то есть до последних задач */
function analytics(){
  return { cur: anaAt(state.totalXp), prev: anaAt(Math.max(0, state.totalXp - 260)) };
}

function dShort(t){ const d = new Date(t); return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()]; }
/* период из days дней, закончившийся lag дней назад */
function period(days, lag){ const end = state.now - lag * DAY; return dShort(end - (days - 1) * DAY) + ' – ' + dShort(end); }
/* последний понедельник — день съёма позиций */
function lastCheck(){ const d = new Date(state.now); d.setHours(6, 0, 0, 0); while(d.getDay() !== 1) d.setDate(d.getDate() - 1); return d.getTime(); }

function num(n){ return Math.round(n).toLocaleString('ru-RU'); }
/* дельта к прошлому периоду; less — «меньше значит лучше» (позиция, отказы) */
function delta(cur, prev, opt){
  opt = opt || {};
  const diff = cur - prev;
  if(Math.abs(diff) < (opt.eps || .05)) return '<span class="d flat">без изменений</span>';
  const good = opt.less ? diff < 0 : diff > 0;
  let txt;
  if(opt.abs) txt = (diff > 0 ? '+' : '−') + (opt.fix != null ? Math.abs(diff).toFixed(opt.fix).replace('.', ',') : num(Math.abs(diff))) + (opt.unit || '');
  else txt = (diff > 0 ? '+' : '−') + Math.abs(diff / (prev || 1) * 100).toFixed(0) + '%';
  return '<span class="d ' + (good ? 'up' : 'down') + '">' + (diff > 0 ? '▲ ' : '▼ ') + txt + '</span>';
}
function fx(n, k){ return n.toFixed(k).replace('.', ','); }

function metric(label, value, d, hint){
  return '<div class="m"><div class="l">' + label + '</div><div class="n">' + value + '</div>' + (d || '') + (hint ? '<div class="h">' + hint + '</div>' : '') + '</div>';
}

function srcHead(key, periodTxt){
  const s = SOURCES[key];
  return '<div class="src-head"><span class="src-logo" style="background:' + s.color + '">' + s.letter + '</span>' +
    '<div><div class="src-name">' + s.name + '</div><div class="src-what">' + s.what + '</div></div><span class="src-ok">● подключено</span></div>' +
    '<div class="src-period">' + periodTxt + '</div>';
}

function srcCards(){
  const a = analytics(), c = a.cur, p = a.prev;
  const check = lastCheck();

  /* визиты из поиска по неделям — 8 столбиков */
  const bars = [];
  for(let i = 7; i >= 0; i--) bars.push(anaAt(Math.max(0, state.totalXp - i * 45)).visits / 4.3 * (1 + ((i * 37) % 7 - 3) / 60));
  const bmax = Math.max.apply(null, bars);
  const barsHTML = '<div class="src-bars" title="Визиты из поиска по неделям">' + bars.map(function(v, i){
    return '<i style="height:' + Math.round(v / bmax * 100) + '%"' + (i === 7 ? ' class="now"' : '') + '></i>'; }).join('') + '</div>' +
    '<div class="src-bars-l"><span>8 недель назад</span><span>эта неделя</span></div>';

  const problems = state.incident
    ? metric('Проблемы сайта', '<span style="color:#D0453A">1 критичная</span>', '<span class="d flat">команда уже чинит</span>')
    : metric('Проблемы сайта', '0 критичных', '<span class="d up">✓ всё в порядке</span>');

  const pct = function(n){ return Math.round(n / CORE_SIZE * 100); };
  const dist = [[c.top3, '#1E8E50', 'ТОП-3'], [c.top10 - c.top3, '#35C77A', 'ТОП-4…10'], [c.top30 - c.top10, '#9CD9B5', 'ТОП-11…30'], [CORE_SIZE - c.top30, '#E4E7EE', 'дальше 30']];

  return [
    '<div class="src-card">' + srcHead('topvisor', 'Съём ' + dShort(check) + ' · ' + CORE_SIZE + ' запросов · Яндекс, Москва · сравнение со съёмом ' + dShort(check - 28 * DAY)) +
      '<div class="src-grid">' +
        metric('В ТОП-3', pct(c.top3) + '%', delta(pct(c.top3), pct(p.top3), { abs:true, unit:' п.п.' }), c.top3 + ' из ' + CORE_SIZE + ' запросов') +
        metric('В ТОП-10', pct(c.top10) + '%', delta(pct(c.top10), pct(p.top10), { abs:true, unit:' п.п.' }), c.top10 + ' из ' + CORE_SIZE + ' запросов') +
        metric('В ТОП-30', pct(c.top30) + '%', delta(pct(c.top30), pct(p.top30), { abs:true, unit:' п.п.' }), c.top30 + ' из ' + CORE_SIZE + ' запросов') +
        metric('Видимость', c.vis + '%', delta(c.vis, p.vis, { abs:true, unit:' п.п.' }), 'доля возможных переходов') +
      '</div>' +
      '<div class="top-dist">' + dist.map(function(x){ return '<i style="flex:' + x[0] + ';background:' + x[1] + '"></i>'; }).join('') + '</div>' +
      '<div class="top-leg">' + dist.map(function(x){ return '<span><i style="background:' + x[1] + '"></i>' + x[2] + ' · ' + x[0] + '</span>'; }).join('') + '</div>' +
      '<div class="src-foot">' + SOURCES.topvisor.sync + '</div></div>',

    '<div class="src-card">' + srcHead('metrika', 'Органический трафик · ' + period(30, 1) + ' (30 дней) · к предыдущим 30 дням') +
      '<div class="src-grid">' +
        metric('Визиты из поиска', num(c.visits), delta(c.visits, p.visits), 'Яндекс + Google') +
        metric('Заявки', num(c.leads), delta(c.leads, p.leads), 'цели: форма и звонок') +
        metric('Конверсия в заявку', fx(c.conv, 2) + '%', delta(c.conv, p.conv, { abs:true, fix:2, unit:' п.п.', eps:.005 })) +
        metric('Отказы', fx(c.bounce, 1) + '%', delta(c.bounce, p.bounce, { abs:true, fix:1, unit:' п.п.', less:true })) +
      '</div>' + barsHTML +
      '<div class="src-foot">' + SOURCES.metrika.sync + '</div></div>',

    '<div class="src-card">' + srcHead('webmaster', 'Поиск Яндекса · ' + period(30, 2) + ' (30 дней) · к предыдущим 30 дням') +
      '<div class="src-grid">' +
        metric('Клики', num(c.yaClicks), delta(c.yaClicks, p.yaClicks)) +
        metric('Показы', num(c.yaShows), delta(c.yaShows, p.yaShows)) +
        metric('Средняя позиция', fx(c.yaPos, 1), delta(c.yaPos, p.yaPos, { abs:true, fix:1, less:true }), 'чем меньше, тем выше') +
        metric('ИКС', num(c.iks), delta(c.iks, p.iks, { abs:true }), 'на ' + dShort(check)) +
        metric('Страниц в поиске', num(c.pages), delta(c.pages, p.pages, { abs:true })) +
        problems +
      '</div>' +
      '<div class="src-foot">' + SOURCES.webmaster.sync + '</div></div>',

    '<div class="src-card">' + srcHead('gsc', 'Поиск Google · ' + period(28, 3) + ' (28 дней) · к предыдущим 28 дням') +
      '<div class="src-grid">' +
        metric('Клики', num(c.gClicks), delta(c.gClicks, p.gClicks)) +
        metric('Показы', num(c.gShows), delta(c.gShows, p.gShows)) +
        metric('CTR', fx(c.gCtr, 1) + '%', delta(c.gCtr, p.gCtr, { abs:true, fix:1, unit:' п.п.' })) +
        metric('Средняя позиция', fx(c.gPos, 1), delta(c.gPos, p.gPos, { abs:true, fix:1, less:true }), 'чем меньше, тем выше') +
      '</div>' +
      '<div class="src-foot">' + SOURCES.gsc.sync + '</div></div>'
  ];
}

function renderData(){
  return '<div class="scr-pad"><div class="scr-title">Данные</div><div class="scr-sub">Цифры по сайту из сервисов, подключённых к проекту</div>' +

      (state.bowl.length > 1 ? '<button class="sheet-link" data-act="feed-all">Покормить всем сразу (' + state.bowl.length + ')</button>' : '');
  }
  if(sheet.type === 'walk'){
    const w = state.walks.find(function(x){ return x.id === sheet.id; });
    if(!w) return '';
    return grab + '<div class="sheet-kicker">' + (state.strict ? 'Встреча' : fl().walk.kicker) + '</div>' +
      '<h3>' + esc(w.title) + '</h3><p>' + fmtDay(w.at) + ', ' + fmtTime(w.at) + ' · ' + esc(w.sub) + '</p>' +
      (w.status === 'pending'
        ? '<div class="sheet-actions"><button class="abtn primary" data-act="walk-ok" data-id="' + w.id + '">' + fl().walk.ok + '</button><button class="abtn" data-act="walk-move" data-id="' + w.id + '">Перенести</button></div>'
        : '<p style="margin-top:6px"><span class="pill ok">подтверждена</span></p><div class="sheet-actions"><button class="abtn" data-act="walk-move" data-id="' + w.id + '">Перенести</button><button class="abtn primary" data-act="close-sheet">Хорошо</button></div>');
  }
  if(sheet.type === 'move'){
    const w = state.walks.find(function(x){ return x.id === sheet.id; });
    if(!w) return '';
    return grab + '<div class="sheet-kicker">Перенести встречу</div><h3>' + esc(w.title) + '</h3>' +
      '<p>Сейчас: ' + fmtDay(w.at) + ', ' + fmtTime(w.at) + '. Выберите новое время — команда увидит перенос сразу.</p>' +
      '<div class="slots">' + moveSlots(w).map(function(s){
        return '<button class="slot" data-act="walk-slot" data-id="' + w.id + '" data-at="' + s + '"><b>' + fmtDay(s) + '</b><span>' + fmtTime(s) + '</span></button>';
      }).join('') + '</div>' +
      '<button class="sheet-link" data-act="close-sheet">Не переносить</button>';
  }
  if(sheet.type === 'edits'){
    const q = state.requests.find(function(x){ return x.id === sheet.id; });
    if(!q) return '';
    const ready = sheet.picks.length || (sheet.note || '').trim();
    return grab + '<div class="sheet-kicker">Есть правки</div><h3>' + esc(q.title) + '</h3>' +
      '<p>Что поправить? Можно выбрать несколько — команда получит всё сразу.</p>' +
      '<div class="chips">' + ((reqData(q) || {}).reasons || EDIT_REASONS).map(function(r){
        return '<button class="chip-e' + (sheet.picks.indexOf(r) !== -1 ? ' on' : '') + '" data-act="edit-pick" data-v="' + esc(r) + '">' + esc(r) + '</button>';
      }).join('') + '</div>' +
      '<textarea class="edit-note" id="edit-note" rows="3" placeholder="Комментарий для команды (необязательно)">' + esc(sheet.note || '') + '</textarea>' +
      '<div class="sheet-actions"><button class="abtn" data-act="open-request" data-id="' + q.id + '">Назад</button><button class="abtn primary" data-act="edit-send" data-id="' + q.id + '"' + (ready ? '' : ' disabled') + '>Отправить правки</button></div>';
  }
  if(sheet.type === 'request'){
    const q = state.requests.find(function(x){ return x.id === sheet.id; });
    if(!q) return '';
    const R = reqData(q) || {};
    const choice = R.type === 'choice';
    const okLabel = choice ? (sheet.pick ? 'Выбрать ' + sheet.pick : 'Выберите вариант') : (R.ok || 'Согласовать');
    return grab + '<div class="sheet-kicker">' + (state.strict ? 'Нужно ваше решение' : fl().play.call) + '</div>' +
      '<h3>' + esc(q.title) + '</h3><p>' + esc(q.text) + '</p>' + reqAttach(q, R) +
      (q.status !== 'open' ? '<p style="margin-top:10px"><span class="pill ' + (q.status === 'done' ? 'ok' : 'wait') + '">' + (q.status === 'done' ? 'согласовано' : 'на доработке') + '</span></p>' +
          '<div class="sheet-actions"><button class="abtn primary" data-act="close-sheet">Закрыть</button></div>'
        : '<div class="sheet-actions"><button class="abtn primary" data-act="req-ok" data-id="' + q.id + '"' + (choice && !sheet.pick ? ' disabled' : '') + '>' + okLabel + '</button>' +
          '<button class="abtn" data-act="req-edit" data-id="' + q.id + '">' + (R.edit || 'Есть правки') + '</button></div>');
  }
  if(sheet.type === 'doc'){
    const q = state.requests.find(function(x){ return x.id === sheet.id; });
    const R = reqData(q);
    if(!q || !R || !R.doc) return '';
    let body = '';
    if(R.type === 'texts') body = R.items.map(function(it){ return '<div class="doc-sec"><h4>' + esc(it[0]) + '</h4><p>' + esc(it[1]) + '</p><p>' + esc(it[2]) + '</p></div>'; }).join('');
    if(R.type === 'list') body = '<table class="qt"><tr><th>#</th><th>Запрос</th><th>В месяц</th></tr>' + allQueries(R).map(function(r, i){ return '<tr><td>' + (i + 1) + '</td><td>' + esc(r[0]) + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>';
    return grab + '<div class="sheet-kicker">' + esc(R.doc.kind) + '</div><h3>' + esc(R.doc.name) + '</h3>' +
      '<div class="doc-view">' + body + '</div>' +
      '<div class="sheet-actions"><button class="abtn primary" data-act="open-request" data-id="' + q.id + '">‹ Назад к согласованию</button></div>';
  }  if(sheet.type === 'incident' && state.incident){
    return grab + '<div class="sheet-kicker">Инцидент · в работе</div><h3>' + esc(state.incident.title) + '</h3><p>' + esc(state.incident.text) + '</p>' +
      '<div class="sheet-actions"><button class="abtn primary" data-act="close-sheet">Понятно</button></div>';
  }
  if(sheet.type === 'stages'){
    const cur = state.screen === 'onboard' ? 'egg' : stage();
    return grab + '<div class="sheet-kicker">' + esc(state.name || pet().label) + ' · ' + pet().label.toLowerCase() + '</div>' +
      '<h3>Этапы роста</h3><p>Питомец растёт с каждой выполненной задачей. Каждый следующий уровень дороже предыдущего.</p>' +
      '<div class="stages-list">' + STAGE_INFO.map(function(s){
        return '<div class="stg-row' + (s[0] === cur ? ' now' : '') + '"><div class="stg-img">' + petAnim(state.kind, s[0], false, -(STAGE_INFO.indexOf(s) * .6).toFixed(1)) + '</div>' +
          '<div><div class="stg-name"><b>' + STAGE_LABEL[s[0]] + '</b><span class="lv">' + s[1] + '</span>' +
          (s[0] === cur ? '<span class="pill ok">сейчас</span>' : '') + '</div>' +
          '<div class="stg-desc">' + s[2] + '</div></div></div>';
      }).join('') + '</div>' +
      '<div class="sheet-actions"><button class="abtn primary" data-act="close-sheet">Понятно</button></div>';
  }
  if(sheet.type === 'levelup'){
    const st = stageOf(sheet.level);
    let title, text;
    if(sheet.hatched && st === 'baby'){ title = 'Привет, ' + esc(state.name) + '!'; text = 'Первая задача выполнена — и из яйца появился малыш. Дальше он будет расти с каждой сделанной работой.'; }
    else if(sheet.stageChanged){ title = esc(state.name) + ' теперь ' + STAGE_LABEL[st].toLowerCase() + '!'; text = 'Новая стадия роста. Столько работы уже сделано по проекту.'; }
    else { title = 'Уровень ' + sheet.level; text = 'До следующего уровня — ' + need(sheet.level) + ' XP.'; }
    return '<div style="text-align:center">' +
      '<div class="pet grow" style="width:168px;height:168px;margin:0 auto">' + spriteSVG(state.kind, st, false) + '</div>' +
      '<div class="sheet-kicker" style="margin-top:8px">Уровень ' + sheet.level + '</div>' +
      '<h3>' + title + '</h3><p>' + text + '</p>' +
      '<div class="sheet-actions"><button class="abtn primary" data-act="close-sheet">Ура!</button></div></div>';
  }
  return '';
}

function renderSheets(){
  const html = sheetHTML();
  ['phone-sheet', 'cab-sheet'].forEach(function(id){
    const layer = document.getElementById(id);
    const active = (id === 'phone-sheet') === (state.view === 'phone');
    if(html && active){
      const keep = layer.firstChild.scrollTop;
      layer.firstChild.innerHTML = html;
      if(sheet && sheet.type === renderSheets.last) layer.firstChild.scrollTop = keep;
      layer.classList.toggle('light', !!(sheet && sheet.type === 'decor'));
      layer.classList.add('show');
    } else {
      layer.classList.remove('show');
    }
  });
  if(!html) sheet = null;
  renderSheets.last = sheet && sheet.type;
}

/* ============================================================
   РЕНДЕР: ПУЛЬТ
   ============================================================ */

function renderConsole(){
  /* подсказки на кнопках — голосом выбранного питомца */
  const has = !!state.kind;
  document.getElementById('btn-walk').innerHTML = '<span class="e">' + iconSVG(has ? fl().walk.icon : '🌳', 24) + '</span>Назначить встречу<small>«' + (has ? fl().walk.call.toLowerCase().replace(/[?!]+$/, '') : 'пора гулять') + '»</small>';
  document.getElementById('btn-request').innerHTML = '<span class="e">' + iconSVG(has ? fl().play.icon : '🎾', 24) + '</span>Нужно согласование<small>«' + (has ? fl().play.call.toLowerCase().replace(/[?!]+$/, '') : 'поиграешь?') + '»</small>';
  const meet = document.getElementById('btn-meet');
  const mt = has ? meetTarget() : null;
  const phase = state.scene ? state.scene.phase : null;
  meet.classList.toggle('on', !!phase);
  meet.innerHTML = '<span class="e">' + iconSVG(phase === 'walk' ? 'check' : 'calendar', 24) + '</span><span>' +
    (phase === 'walk' ? 'Встреча закончилась<br><small>питомец вернётся домой довольным</small>'
      : phase === 'pre' ? 'Встреча началась<br><small>«' + esc(SCENES[state.kind].walk.text.toLowerCase()) + '»</small>'
      : 'За 30 минут до встречи<br><small>' + (mt ? '«' + esc(SCENES[state.kind].pre.text.toLowerCase()) + '»' : 'сначала назначьте встречу') + '</small>') + '</span>';
  const inc = document.getElementById('btn-incident');
  inc.classList.toggle('on', !!state.incident);
  inc.innerHTML = state.incident
    ? '<span class="e">' + iconSVG('check', 24) + '</span><span>Закрыть инцидент<br><small>«всё починили»</small></span>'
    : '<span class="e">' + iconSVG('bandage', 24) + '</span><span>Инцидент на сайте<br><small>«нами уже занимаются»</small></span>';
  document.querySelectorAll('.console [data-ev]').forEach(function(b){ b.disabled = !state.kind || state.screen === 'onboard'; });
  document.getElementById('c-log').innerHTML = state.log.length
    ? '<div class="c-label">Лента событий</div>' + state.log.map(function(l){ const d = new Date(l.t); return '<div class="li"><span style="white-space:nowrap">' + d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()] + '</span><b>' + esc(l.text) + '</b></div>'; }).join('')
    : '';
  const note = document.getElementById('c-note');
  if(!state.kind || state.screen === 'onboard'){
    note.innerHTML = '👈 Сначала пройдите онбординг в приложении: выберите питомца и имя.';
  } else if(state.level === 0){
    note.innerHTML = 'Закройте первую задачу — клиенту придёт уведомление, и после кормления яйцо вылупится.';
  } else {
    note.innerHTML = 'Каждая кнопка — событие, которое в реальности пришло бы из таск-трекера (задачи), календаря (встречи) или от менеджера (отчёты, согласования). Питомец переводит их в уведомления.';
  }
  document.getElementById('sim-date').textContent = 'Дата в демо: ' + fmtDay(state.now);
}

function renderAll(){
  document.getElementById('phone').hidden = state.view !== 'phone';
  document.getElementById('browser').hidden = state.view !== 'cabinet';
  document.querySelectorAll('#view-switch button').forEach(function(b){ b.classList.toggle('active', b.dataset.view === state.view); });
  if(state.view === 'phone') renderApp(); else renderCabinet();
  renderSheets();
  renderConsole();
  actorDraw();
}

/* ============================================================
   ЭФФЕКТЫ
   ============================================================ */

function petHost(){
  if(state.view === 'phone') return document.getElementById('room');
  return cabMain.querySelector('.mini-room');
}
function floatFx(text, cls){
  const host = petHost();
  if(!host) return;
  const el = document.createElement('div');
  el.className = 'fx ' + cls;
  el.textContent = text;
  el.style.left = (host.clientWidth / 2 + 30) + 'px';
  el.style.top = (host.clientHeight * 0.35) + 'px';
  host.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1200);
}
function burstFood(emoji){
  const host = petHost();
  if(!host) return;
  const el = document.createElement('div');
  el.className = 'fx food';
  el.innerHTML = iconSVG(emoji, 36);
  const startX = host.clientWidth - 70, startY = host.clientHeight - 70;
  el.style.left = startX + 'px';
  el.style.top = startY + 'px';
  el.style.setProperty('--dx', (host.clientWidth / 2 - startX) + 'px');
  el.style.setProperty('--dy', (host.clientHeight * 0.55 - startY) + 'px');
  host.appendChild(el);
  setTimeout(function(){ el.remove(); }, 700);
}

let noteTimer = null;
function flashNote(text){
  const note = document.getElementById('c-note');
  note.textContent = text;
  note.style.color = 'var(--warn)';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ note.style.color = ''; renderConsole(); }, 2500);
}

/* ============================================================
   СОБЫТИЯ ИНТЕРФЕЙСА
   ============================================================ */

document.addEventListener('click', function(e){
  const viewBtn = e.target.closest('[data-view]');
  if(viewBtn){
    state.view = viewBtn.dataset.view;
    bellOpen = false;
    save(); renderAll();
    return;
  }

  const evBtn = e.target.closest('[data-ev]');
  if(evBtn){ fire(evBtn.dataset.ev); return; }

  if(e.target.closest('[data-reset]')){
    if(state.kind && !confirm('Начать демо заново? Питомец и весь прогресс сбросятся.')) return;
    try{ localStorage.removeItem(STORE_KEY); }catch(err){}
    state = freshState();
    sheet = null; petFx = null; bellOpen = false;
    pushEl.classList.remove('show');
    document.getElementById('toasts').innerHTML = '';
    Object.keys(prevW).forEach(function(k){ delete prevW[k]; });
    renderAll();
    return;
  }

  const pushed = e.target.closest('#push, .toast, .bell-pop [data-nid]');
  if(pushed && pushed.dataset.nid){ bellOpen = false; openNotif(pushed.dataset.nid); return; }

  const pick = e.target.closest('[data-pick]');
  if(pick){
    state.kind = pick.dataset.pick;
    state.name = ANIMALS[state.kind].name;
    save(); renderAll();
    return;
  }

  const tab = e.target.closest('[data-tab]');
  if(tab){ state.screen = tab.dataset.tab; save(); renderAll(); return; }

  const cab = e.target.closest('[data-cab]');
  if(cab){ cabPage = cab.dataset.cab; bellOpen = false; renderCabinet(); document.getElementById('cabinet').scrollIntoView({ block:'nearest' }); return; }

  const layer = e.target.closest('.sheet-layer');
  if(layer && !e.target.closest('.sheet')){ sheet = null; renderSheets(); return; }

  const act = e.target.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  const id = act.dataset.id ? parseInt(act.dataset.id, 10) : null;

  if(a === 'name-ok'){
    const v = (document.getElementById('name-input').value || '').trim();
    state.name = v || pet().name;
    state.onb = 'egg';
    save(); renderAll();
  }
  else if(a === 'open-data'){
    sheet = null;
    if(state.view === 'phone'){ state.screen = 'data'; save(); } else cabPage = 'analytics';
    renderAll();
  }
  else if(a === 'back-pick'){ state.onb = 'pick'; save(); renderAll(); }
  else if(a === 'pick-ok'){ state.onb = 'name'; save(); renderAll(); }
  else if(a === 'onb-done'){
    state.screen = 'home';
    state.startedAt = state.now;
    addDiary({ kind:'start', icon:'🥚', title: 'Проект стартовал, у вас появилось яйцо', sub: ANIMALS[state.kind].label + ' по имени ' + state.name });
    save(); renderAll();
  }
  else if(a === 'open-feed'){ if(state.bowl.length){ sheet = { type:'feed' }; renderSheets(); } }
  else if(a === 'feed'){ doFeed(id); }
  else if(a === 'feed-all'){
    let res = [];
    while(state.bowl.length){ res.push(feedOne(state.bowl[0].id)); }
    const ups = [].concat.apply([], res.map(function(r){ return r.ups; }));
    const hatched = res.some(function(r){ return r.hatched; });
    const xp = res.reduce(function(s, r){ return s + REWARDS[r.food.type].xp; }, 0);
    if(res.length >= 5) inc('feast');
    sheet = null;
    const grow = ups.some(function(u){ return u.stageChanged; }) || hatched;
    petFx = grow ? 'grow' : 'act';
    const ms = grow ? 1600 : eatShow();
    save(); renderAll();
    burstFood(pet().food);
    floatFx('+' + xp + ' XP', 'xp');
    if(ups.length){
      setTimeout(function(){
        sheet = { type:'levelup', level: ups[ups.length - 1].level, hatched: hatched, stageChanged: ups.some(function(u){ return u.stageChanged; }) };
        renderSheets();
      }, grow ? 900 : ms);
    }
    clearFxLater(ms);
  }
  else if(a === 'pet'){ doPet(); }
  else if(a === 'open-walk'){ sheet = { type:'walk', id: id }; renderSheets(); }
  else if(a === 'walk-ok'){ answerWalk(id, 'ok'); }
  else if(a === 'walk-move'){ sheet = { type:'move', id: id }; renderSheets(); }
  else if(a === 'walk-slot'){ answerWalk(id, parseInt(act.dataset.at, 10)); }
  else if(a === 'open-request'){ sheet = { type:'request', id: id }; renderSheets(); }
  else if(a === 'req-ok'){ answerRequest(id, 'ok', sheet && sheet.pick); }
  else if(a === 'req-edit'){ sheet = { type:'edits', id: id, picks: [], note: '' }; renderSheets(); }
  else if(a === 'edit-pick' && sheet && sheet.type === 'edits'){
    const v = act.dataset.v, i = sheet.picks.indexOf(v);
    if(i === -1) sheet.picks.push(v); else sheet.picks.splice(i, 1);
    renderSheets();
  }
  else if(a === 'edit-send' && sheet && sheet.type === 'edits'){
    answerRequest(id, { picks: sheet.picks.slice(), note: (sheet.note || '').trim() });
  }
  else if(a === 'open-incident'){ sheet = { type:'incident' }; renderSheets(); }
  else if(a === 'stages'){ if(state.kind){ inc('stagesSeen'); save(); sheet = { type:'stages' }; renderSheets(); } }
  else if(a === 'req-pick' && sheet && sheet.type === 'request'){ sheet.pick = act.dataset.v; renderSheets(); }
  else if(a === 'open-doc'){ sheet = { type:'doc', id: id }; renderSheets(); }
  else if(a === 'close-sheet'){ sheet = null; renderSheets(); }
  else if(a === 'strict'){ state.strict = !state.strict; save(); renderAll(); }
  else if(a === 'bell'){ bellOpen = !bellOpen; if(bellOpen) state.unread = 0; save(); renderAll(); }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'edit-note' && sheet && sheet.type === 'edits'){
    sheet.note = e.target.value;
    const send = document.querySelector('.sheet-layer.show [data-act="edit-send"]');
    if(send) send.disabled = !(sheet.picks.length || sheet.note.trim());
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.id === 'name-input'){
    document.querySelector('[data-act="name-ok"]').click();
  }
  if(e.key === 'Escape' && sheet){ sheet = null; renderSheets(); }
});

/* часы в статус-баре */
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
tick();
setInterval(tick, 30000);

/* режим просмотра сценки: demo.html#scene=dog:walk (pre, walk или room) —
   показывает только комнату, ничего не сохраняет. Используется в scenes.html */
const PREVIEW = /scene=(\w+):(\w+)/.exec(location.hash);
if(PREVIEW && ANIMALS[PREVIEW[1]]){
  save = function(){};
  state = freshState();
  state.kind = PREVIEW[1];
  state.name = ANIMALS[state.kind].name;
  state.onb = 'egg';
  state.screen = 'home';
  state.level = 6;
  state.walks = [{ id: 1, title: 'Созвон: итоги месяца', sub: '', at: state.now + 30 * 60000, status: 'confirmed' }];
  state.scene = PREVIEW[2] === 'room' ? null : { phase: PREVIEW[2], id: 1 };
  document.body.classList.add('preview');
}

/* статичные кнопки пульта: эмодзи → пиксельные значки */
document.querySelectorAll('.console .cbtn .e').forEach(function(el){ el.innerHTML = iconSVG(el.textContent.trim(), 24); });

renderAll();
</script>

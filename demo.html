<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Питомец проекта — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #0067FF;
    --accent-dark: #0749AA;
    --accent-soft: rgba(0,103,255,.12);
    --bg: #051634;
    --panel: #0A2250;
    --panel-2: #0E2B61;
    --line: #1A3C78;
    --text: #F2F7FF;
    --muted: #93A8CC;
    --dim: #6A83AE;
    --ok: #35C77A;
    --warn: #FFA412;

    /* экран приложения — светлый, «игрушечный» */
    --app-bg: #F2F7FF;
    --app-card: #FFFFFF;
    --app-ink: #16264A;
    --app-soft: #66779A;
    --app-line: #E1E8F3;
    --joy: #FF8FB1;
    --food: #FFA412;
    --xp: #0067FF;

    --pixel: "Press Start 2P", ui-monospace, monospace;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    font-family: "Roboto Condensed", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input{ font-family: inherit; }
  button{ cursor: pointer; }

  /* ---------- каркас страницы ---------- */
  .page{
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 24px 48px;
  }
  .page-head{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .brand-mark{
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel);
    font-size: 12px;
    color: #fff;
  }
  .brand-name{ font-weight: 800; font-size: 17px; }
  .brand-sub{ font-size: 12.5px; color: var(--muted); }
  .view-switch{
    margin-left: auto;
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
  }
  .view-switch button{
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 9px;
  }
  .view-switch button.active{ background: var(--accent); color: #fff; }

  .layout{
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 28px;
    align-items: start;
  }
  .stage{
    display: flex;
    justify-content: center;
    min-width: 0;
  }

  /* ---------- телефон ---------- */
  .phone{
    width: 372px;
    height: 780px;
    border-radius: 52px;
    background: #0F0F13;
    padding: 12px;
    box-shadow: 0 0 0 2px #1D3A73, 0 30px 80px rgba(0,0,0,.55);
    position: relative;
    flex-shrink: 0;
  }
  .phone-screen{
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: var(--app-bg);
    color: var(--app-ink);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .statusbar{
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 13.5px;
    font-weight: 700;
    position: relative;
  }
  .statusbar::after{
    content: "";
    position: absolute;
    left: 50%; top: 10px;
    transform: translateX(-50%);
    width: 104px; height: 28px;
    background: #0F0F13;
    border-radius: 20px;
  }
  .app-view{
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    scrollbar-width: none;
  }
  .app-view::-webkit-scrollbar{ display: none; }
  .tabbar{
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    border-top: 1px solid var(--app-line);
    background: #fff;
    padding: 6px 6px 18px;
  }
  .tabbar button{
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--app-soft);
    padding: 6px 0;
    position: relative;
  }
  .tabbar button .ti{ font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .6; }
  .tabbar button.active{ color: var(--accent); }
  .tabbar button.active .ti{ filter: none; opacity: 1; }
  .tab-badge{
    position: absolute;
    top: 2px; left: 50%;
    margin-left: 6px;
    min-width: 16px; height: 16px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    line-height: 16px;
    padding: 0 4px;
  }

  /* push-баннер */
  .push{
    position: absolute;
    left: 10px; right: 10px;
    top: 8px;
    z-index: 30;
    background: rgba(255,255,255,.97);
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(7,73,170,.25);
    padding: 12px 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    transform: translateY(-140%);
    transition: transform .45s cubic-bezier(.2,.9,.3,1.2);
    cursor: pointer;
    color: var(--app-ink);
  }
  .push.show{ transform: translateY(0); }
  /* реплика питомца поверх любого экрана */
  .say{ position: absolute; left: 12px; right: 12px; bottom: 84px; z-index: 18; display: flex; align-items: center; gap: 10px;
         background: #fff; border-radius: 18px; padding: 8px 14px 8px 8px; box-shadow: 0 10px 28px rgba(7,73,170,.22);
         opacity: 0; transform: translateY(16px); transition: opacity .25s ease, transform .25s ease; pointer-events: none; }
  .say.show{ opacity: 1; transform: translateY(0); }
  .say-pet{ width: 48px; height: 48px; flex-shrink: 0; }
  .say-pet svg{ width: 100%; height: 100%; }
  .say-text{ font-size: 14px; font-weight: 700; color: var(--app-ink); line-height: 1.3; }
  .push-icon{
    width: 40px; height: 40px;
    border-radius: 11px;
    background: var(--app-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .push-icon svg{ width: 48px; height: 48px; }
  .push-app{ font-size: 11px; color: var(--app-soft); display: flex; justify-content: space-between; }
  .push-title{ font-size: 14px; font-weight: 700; line-height: 1.3; }
  .push-body{ font-size: 13px; color: var(--app-soft); line-height: 1.35; }

  /* ---------- общий слой листов/модалок внутри устройства ---------- */
  .sheet-layer{
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(5,22,52,.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .sheet-layer.show{ opacity: 1; pointer-events: auto; }
  .sheet{
    width: 100%;
    background: #fff;
    color: var(--app-ink);
    border-radius: 26px 26px 0 0;
    padding: 22px 22px 28px;
    transform: translateY(40px);
    transition: transform .25s ease;
    max-height: 88%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .sheet::-webkit-scrollbar{ display: none; }
  .sheet-layer.show .sheet{ transform: translateY(0); }
  .cabinet .sheet-layer{ align-items: center; }
  .cabinet .sheet{ width: 440px; border-radius: 20px; }
  .sheet-grab{
    width: 40px; height: 4px;
    border-radius: 2px;
    background: var(--app-line);
    margin: -8px auto 16px;
  }
  .sheet-kicker{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .sheet h3{ font-size: 19px; line-height: 1.3; margin-bottom: 8px; }
  .sheet p{ font-size: 14px; color: var(--app-soft); }
  .sheet-food{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--app-bg);
    border-radius: 16px;
    padding: 14px;
    margin: 16px 0;
  }
  .sheet-food .big{ font-size: 36px; line-height: 1; }
  .sheet-food .what{ font-size: 13px; color: var(--app-soft); }
  .sheet-food .xp{ margin-left: auto; font-family: var(--pixel); font-size: 11px; color: var(--accent); white-space: nowrap; }
  .sheet-actions{ display: flex; gap: 10px; margin-top: 18px; }
  .sheet-actions .abtn{ flex: 1; }
  .stages-list{ display: grid; gap: 8px; margin-top: 14px; }
  .stg-row{
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 10px;
    align-items: center;
    background: var(--app-bg);
    border-radius: 16px;
    padding: 6px 12px 6px 4px;
  }
  .stg-row.now{ box-shadow: inset 0 0 0 2px var(--accent); }
  .stg-row svg{ width: 72px; height: 72px; display: block; }
  .stg-name{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14.5px; }
  .stg-name .lv{ font-family: var(--pixel); font-size: 8px; color: var(--accent); }
  .stg-desc{ font-size: 12.5px; color: var(--app-soft); line-height: 1.4; margin-top: 2px; }
  .link-btn{
    background: none;
    border: none;
    padding: 0;
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
  }
  .lvl-badge.btn{ border: none; cursor: pointer; }
  .reset-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 12px;
  }
  .reset-btn:hover{ border-color: var(--accent); }
  .sheet-link{
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    font-size: 13px;
    color: var(--app-soft);
    text-decoration: underline;
  }
  .report-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0 6px;
  }
  .report-cell{
    background: var(--app-bg);
    border-radius: 14px;
    padding: 12px;
  }
  .report-cell .n{ font-size: 22px; font-weight: 800; }
  .report-cell .l{ font-size: 12px; color: var(--app-soft); }

  /* кнопки приложения */
  .abtn{
    border: none;
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 14.5px;
    font-weight: 700;
    background: var(--app-bg);
    color: var(--app-ink);
    transition: transform .1s ease, background .15s ease;
  }
  .abtn:active{ transform: scale(.97); }
  .abtn.primary{ background: var(--accent); color: #fff; }
  .abtn.primary:hover{ background: var(--accent-dark); }
  .abtn:disabled{ opacity: .45; cursor: default; }
  .abtn.small{ padding: 8px 12px; font-size: 13px; border-radius: 11px; }

  /* ---------- экран «Питомец» ---------- */
  .app-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px 10px;
  }
  .app-head .pname{ font-size: 20px; font-weight: 800; }
  .app-head .pkind{ font-size: 12.5px; color: var(--app-soft); }
  .lvl-badge{
    font-family: var(--pixel);
    font-size: 10px;
    background: var(--app-ink);
    color: #fff;
    border-radius: 10px;
    padding: 8px 10px;
    white-space: nowrap;
  }
  .room{
    margin: 0 16px;
    height: 290px;
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: inset 0 0 0 1px #E1E8F3;
  }
  .prop{ position: absolute; pointer-events: none; line-height: 0; }
  .room .speech{ z-index: 4; }
  .room .pet-spot{ z-index: 2; }

  /* сценки встреч */
  .pose-sill{ bottom: 131px !important; }
  .room.sc-sill .speech, .room.sc-fly .speech{ top: auto; bottom: 22px; }
  .room.sc-sill .room-shelf{ display: none; }
  .pose-door{ margin-left: -20px !important; }
  .actor{ position: absolute; inset: 0; }
  .actor svg{ width: 100%; height: 100%; display: block; }
  .pose-fly{ bottom: 96px !important; transform: scale(.8); transform-origin: 50% 100%; }
  .pose-hunt{ bottom: 12px !important; }
  .pose-wheelside{ margin-left: -8px !important; }
  .pose-wheel{ bottom: 44px !important; }
  .pose-mud{ transform: translateY(34px); }
  .pose-mud .pet{ clip-path: inset(0 0 28% 0); animation: rock 1.4s steps(1, end) infinite !important; }
  @keyframes rock{ 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-6px); } 75%{ transform: translateX(6px); } }
  .birdie{ position: absolute; top: 64px; left: 50%; margin-left: -54px; line-height: 0; z-index: 1; animation: birdie 4s steps(24, end) infinite; }
  @keyframes birdie{ 0%{ transform: translate(0, 0); opacity: 0; } 10%{ opacity: 1; } 50%{ transform: translate(36px, -6px); } 90%{ opacity: 1; } 100%{ transform: translate(72px, 6px); opacity: 0; } }
  .cyc3{ display: grid; }
  .cyc3 svg{ grid-area: 1 / 1; opacity: 0; animation: cyc3 .36s steps(1, end) infinite; }
  .cyc3 svg:nth-child(2){ animation-delay: .12s; }
  .cyc3 svg:nth-child(3){ animation-delay: .24s; }
  @keyframes cyc3{ 0%{ opacity: 1; } 33.4%{ opacity: 0; } 100%{ opacity: 0; } }
  .rise{ position: absolute; z-index: 3; line-height: 0; animation: rise 1.8s steps(8, end) infinite; }
  .pose-mudpre{ transform: translateY(8px); }
  @keyframes rise{ 0%{ transform: translateY(0); opacity: 1; } 100%{ transform: translateY(-60px); opacity: 0; } }
  .crown-over{ position: absolute; left: 50%; top: 18px; margin-left: -20px; line-height: 0; animation: bob 1.6s steps(1, end) infinite; }

  /* режим просмотра одной сценки (для scenes.html) */
  body.preview{ min-height: 0; background: transparent; overflow: hidden; }
  body.preview .page{ padding: 0; max-width: none; }
  body.preview .layout{ display: block; }
  body.preview .page-head, body.preview .console, body.preview .statusbar, body.preview .tabbar,
  body.preview .app-head, body.preview .stats, body.preview .home-actions, body.preview .home-cards,
  body.preview .decor-btn{ display: none !important; }
  body.preview .stage{ display: block; }
  body.preview .phone{ width: 100%; height: auto; padding: 0; box-shadow: none; background: none; border-radius: 0; }
  body.preview .phone-screen{ border-radius: 0; background: transparent; height: auto; display: block; }
  body.preview .app-view{ flex: none; height: auto; overflow: hidden; }
  body.preview .room{ margin: 0; border-radius: 0; }

  .sheet-layer.light{ background: rgba(5,22,52,.08); }
  .room-shelf{
    position: absolute;
    top: 18px; right: 16px;
    width: 140px;
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-end;
    gap: 2px;
    font-size: 20px;
    line-height: 1;
    padding-bottom: 0;
    min-height: 30px;
  }
  .room-shelf .tr{ position: relative; display: inline-flex; cursor: help; outline: none; animation: pop .4s ease; }
  .room-shelf .tip{ display: none; position: absolute; right: -6px; top: 34px; width: 190px; z-index: 8; background: #16264A; color: #fff; font-size: 12px; font-weight: 500; line-height: 1.35; padding: 8px 10px; border-radius: 10px; box-shadow: 0 8px 20px rgba(7,73,170,.3); text-align: left; }
  .room-shelf .tip b{ display: block; font-size: 13px; margin-bottom: 2px; }
  .room-shelf .tr:hover .tip, .room-shelf .tr:focus .tip{ display: block; }
  .room-shelf .more{ border: none; background: #EEF4FF; color: var(--accent); font-weight: 700; font-size: 12px; border-radius: 8px; padding: 0 7px; height: 28px; align-items: center; cursor: pointer; }
  .citem .cd{ font-size: 10.5px; color: var(--app-soft); margin-top: 3px; line-height: 1.25; }
  .att{ margin: 14px 0 4px; display: grid; gap: 8px; }
  .doc-card{ display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--app-bg); border: 2px solid var(--app-line); border-radius: 14px; padding: 10px 12px; color: var(--app-ink); text-decoration: none; }
  .doc-card:hover{ border-color: var(--accent); }
  .doc-card b{ display: block; font-size: 13.5px; line-height: 1.25; }
  .doc-card span span{ font-size: 12px; color: var(--app-soft); }
  .doc-card .go{ margin-left: auto; color: var(--accent); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .prev{ background: var(--app-bg); border-radius: 12px; padding: 10px 12px; }
  .prev b{ font-size: 13px; }
  .prev p{ font-size: 12.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .steps{ margin: 0; padding: 10px 12px 10px 30px; background: var(--app-bg); border-radius: 12px; font-size: 13px; line-height: 1.45; }
  .login{ font-size: 13px; color: var(--app-soft); }
  .login code{ background: #EEF4FF; color: var(--accent); padding: 2px 6px; border-radius: 6px; font-weight: 700; }
  .opts{ grid-template-columns: 1fr 1fr; }
  .opt{ border: 2px solid var(--app-line); background: #fff; border-radius: 14px; padding: 6px; text-align: left; }
  .opt.on{ border-color: var(--accent); box-shadow: 0 0 0 3px #EEF4FF; }
  .opt .mock{ display: block; border-radius: 9px; padding: 10px 8px; min-height: 96px; }
  .opt .mock b{ display: block; font-size: 12px; line-height: 1.25; }
  .opt .mock small{ display: block; font-size: 10px; opacity: .85; margin: 3px 0 7px; }
  .opt .mock i{ font-style: normal; font-size: 10px; font-weight: 700; background: rgba(255,255,255,.9); color: #1B2A4A; padding: 3px 7px; border-radius: 999px; }
  .opt .lab{ display: block; font-size: 12.5px; font-weight: 700; margin: 6px 2px 0; }
  .qt{ width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .qt th{ text-align: left; color: var(--app-soft); font-weight: 600; padding: 4px 6px; border-bottom: 2px solid var(--app-line); }
  .qt td{ padding: 5px 6px; border-bottom: 1px solid var(--app-line); }
  .qt td:last-child, .qt th:last-child{ text-align: right; white-space: nowrap; }
  .qt .more{ color: var(--app-soft); text-align: left !important; font-style: italic; }
  .doc-view{ margin: 12px 0 4px; max-height: 360px; overflow-y: auto; background: var(--app-bg); border-radius: 12px; padding: 12px; }
  .doc-sec + .doc-sec{ margin-top: 12px; }
  .doc-sec h4{ font-size: 14px; margin-bottom: 4px; }
  .doc-sec p{ font-size: 13px; margin-bottom: 6px; color: var(--app-ink); }
  .ico{ display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .bowl{
    position: absolute;
    right: 28px; bottom: 18px;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    background: none;
    border: none;
  }
  .bowl .cnt{
    position: absolute;
    top: -8px; right: -10px;
    background: var(--accent);
    color: #fff;
    font-family: var(--pixel);
    font-size: 8px;
    border-radius: 8px;
    padding: 4px 5px;
  }
  .bowl.has{ animation: wiggle 1.4s ease-in-out infinite; }
  .pet-spot{
    position: absolute;
    left: 50%; bottom: 16px;
    width: 144px; height: 144px;
    margin-left: -72px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .pet{ width: 144px; height: 144px; transform-origin: 50% 100%; }
  .pet svg{ width: 100%; height: 100%; display: block; }
  .pet.idle{ animation: breathe 2.6s ease-in-out infinite; }
  .pet.eat{ animation: chomp .35s ease-in-out 4; }
  .pet.happy{ animation: hop .5s ease-out 2; }
  .pet.grow{ animation: grow 1s ease-out; }
  .pet.bored{ animation: breathe 4.5s ease-in-out infinite; filter: saturate(.7); }
  .pet.sleep{ animation: breathe 5s ease-in-out infinite; }
  .pet.act{ animation: none; }
  @keyframes breathe{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  .pet.idle, .pet.bored, .pet.sleep{ animation-timing-function: steps(1, end); }
  @keyframes chomp{ 0%,100%{ transform: scale(1,1); } 50%{ transform: scale(1.06,.92); } }
  @keyframes hop{ 0%,100%{ transform: translateY(0); } 40%{ transform: translateY(-26px); } }
  @keyframes grow{ 0%{ transform: scale(.6); filter: brightness(3); } 60%{ transform: scale(1.15); filter: brightness(1.4); } 100%{ transform: scale(1); } }
  @keyframes wiggle{ 0%,100%{ transform: rotate(0); } 10%{ transform: rotate(-12deg); } 20%{ transform: rotate(10deg); } 30%{ transform: rotate(0); } }
  @keyframes pop{ from{ transform: scale(0); } to{ transform: scale(1); } }

  .speech{
    position: absolute;
    left: 50%; top: 60px;
    transform: translateX(-50%);
    width: max-content;
    max-width: 220px;
    background: #fff;
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    text-align: center;
    box-shadow: 0 6px 16px rgba(7,73,170,.14);
    z-index: 2;
  }
  .speech::after{
    content: "";
    position: absolute;
    left: 50%; bottom: -6px;

  .fx{

  /* ---------- экраны списка ---------- */

  .walk .t{ font-weight: 700; font-size: 14px; line-height: 1.3; }
  .walk .s{ font-size: 12.5px; color: var(--app-soft); }
  .walk-actions{ display: flex; gap: 8px; margin-top: 12px; }
  .chips{ display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 12px; }
  .chip-e{ border: 2px solid var(--app-line); background: #fff; color: var(--app-ink); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; }

  .edit-note{ width: 100%; border: 2px solid var(--app-line); border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--app-ink); resize: none; outline: none; }

  .slots{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

  .pill{

  .pill.ok{ background: #E3F8EC; color: #1E8E50; }
  .pill.wait{ background: #FFF3DC; color: #A86A00; }

  .coll{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .citem{
    background: #fff;
    border-radius: 16px;
    padding: 14px 8px 12px;
    text-align: center;
  }
  .citem .e{ font-size: 30px; line-height: 1.1; }

  .proj-card{ background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .proj-card h4{ font-size: 14px; margin-bottom: 10px; }
  .pstage{ display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 6px 0; font-size: 13px; align-items: start; }
  .pstage .dot{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--app-line);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #fff;
  }
  .pstage.done .dot{ background: var(--ok); border-color: var(--ok); }
  .pstage.now .dot{ border-color: var(--accent); }
  .pstage.now .dot::after{ content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .pstage .s{ font-size: 11.5px; color: var(--app-soft); }
  .manager{ display: flex; gap: 12px; align-items: center; }
  .manager .ava{
    width: 44px; height: 44px; border-radius: 50%;

    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: var(--accent-dark);
  }
  .toggle-row{ display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; }
  .toggle-row .s{ font-size: 12px; color: var(--app-soft); }
  .switch{
    width: 46px; height: 28px;
    border-radius: 14px;
    background: var(--app-line);
    border: none;
    position: relative;
    flex-shrink: 0;
    transition: background .2s ease;
  }
  .switch::after{
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: transform .2s ease;
  }
  .switch.on{ background: var(--ok); }
  .switch.on::after{ transform: translateX(18px); }

  /* ---------- онбординг ---------- */
  .onb{ padding: 10px 12px 24px; }
  .onb h2{ font-size: 23px; line-height: 1.2; margin: 6px 0 6px; }
  .onb p{ font-size: 13.5px; color: var(--app-soft); margin-bottom: 16px; }
  .pick{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pick button{
    background: #fff;
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 4px 0 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--app-ink);
    transition: border-color .15s ease, transform .15s ease;
    min-width: 0;
  }
  .pick button{ position: relative; }
  .pick button:hover{ border-color: var(--app-line); }
  .pick button.sel{ border-color: var(--accent); background: #EEF4FF; }
  .pick .pa, .pick .pact{ width: 72px; height: 72px; max-width: 100%; }
  /* сценка выбранного питомца: 4 кадра по кругу */
  .pact{ display: block; position: relative; width: 100%; height: 100%; }
  .pact svg{ position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; animation-name: actf; animation-timing-function: steps(1, end); animation-iteration-count: infinite; }
  @keyframes actf{ 0%{ opacity: 1; } 25%{ opacity: 0; } 100%{ opacity: 0; } }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-3px); } }
  .pick-card{ background: #fff; border-radius: 16px; padding: 14px; margin-top: 12px; animation: toastIn .3s ease; }
  .pick-about{ font-size: 13px; color: var(--app-soft); margin-bottom: 12px; line-height: 1.45; }
  .pick-about b{ color: var(--app-ink); }
  .onb-pet .pa{ animation: bob 1.6s steps(1, end) infinite; }
  /* живой спрайт: второй кадр (моргнул, махнул хвостом) показывается на миг */
  .pa{ display: block; position: relative; width: 100%; height: 100%; }
  .pa svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
  .pa svg + svg{ opacity: 0; animation: frameB 3.4s steps(1, end) infinite; animation-delay: inherit; }
  @keyframes frameB{ 0%{ opacity: 0; } 78%{ opacity: 1; } 84%{ opacity: 0; } 90%{ opacity: 1; } 94%{ opacity: 0; } }
  .stg-img{ width: 72px; height: 72px; }
  .pick svg{ width: 72px; height: 72px; max-width: 100%; }
  .onb-how{ margin-top: 18px; display: grid; gap: 8px; }

  .onb-how span{ font-size: 18px; }
  .name-input{
    width: 100%;

    font-weight: 700;

  .onb-pet{ width: 192px; height: 192px; margin: 0 auto 6px; display: block; }
  .onb-pet svg{ width: 100%; height: 100%; }
  .onb .abtn{ width: 100%; }

  /* ---------- личный кабинет (ПК) ---------- */

    width: 100%;

  .cab-grid{ display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }

  .kpi-src i{ width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  .kpi .d.flat{ color: #8A8A94; font-weight: 600; }

<script>
/* ============================================================
   ПИКСЕЛЬНЫЕ ПИТОМЦЫ в духе Stardew Valley
   Каждый зверь собирается из фигур на сетке 24×24.
   Контур, внутренние линии и светотень считаются автоматически.
   Возраст t: 0 — малыш (большая голова), 1 — взрослый.
   Кадр z.alt — второй кадр анимации: моргание + движение хвоста/ушей.
   ============================================================ */

const PW = 24, PH = 24;

function pgrid(){
  return { mat: new Array(PW * PH).fill(null), tone: new Array(PW * PH).fill(1), part: new Array(PW * PH).fill(-1) };
}
function pset(g, x, y, mat, tone, part){
  x = Math.floor(x); y = Math.floor(y);
  if(x < 0 || y < 0 || x >= PW || y >= PH) return;
  const i = y * PW + x;
  g.mat[i] = mat;
  g.tone[i] = tone;
  if(part != null) g.part[i] = part;
}
/* свет сверху-слева: 0 блик, 1 основной, 2 тень */
function ptone(nx, ny, d){
  const t = nx * 0.45 + ny * 0.9;
  if(d > 0.3 && t > 0.5) return 2;
  if(d > 0.35 && t < -0.62) return 0;
  return 1;
}
/* эллипс: part — слой (больше = ближе), paint — только перекрасить уже залитое */
function pell(g, cx, cy, rx, ry, mat, part, paint){
  for(let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++){
    for(let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++){
      const nx = (x + .5 - cx) / rx, ny = (y + .5 - cy) / ry, d = nx * nx + ny * ny;
      if(d > 1 || x < 0 || y < 0 || x >= PW || y >= PH) continue;
      const i = y * PW + x;
      if(paint){ if(g.mat[i] && (part == null || g.part[i] === part)) g.mat[i] = mat; }
      else pset(g, x, y, mat, ptone(nx, ny, d), part);
    }
  }
}
function ptri(g, a, b, c, mat, part, paint){
  const minx = Math.floor(Math.min(a[0], b[0], c[0])), maxx = Math.ceil(Math.max(a[0], b[0], c[0]));
  const miny = Math.floor(Math.min(a[1], b[1], c[1])), maxy = Math.ceil(Math.max(a[1], b[1], c[1]));
  function s(p, q, r){ return (p[0] - r[0]) * (q[1] - r[1]) - (q[0] - r[0]) * (p[1] - r[1]); }
  for(let y = miny; y <= maxy; y++) for(let x = minx; x <= maxx; x++){
    const p = [x + .5, y + .5];
    const d1 = s(p, a, b), d2 = s(p, b, c), d3 = s(p, c, a);
    const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
    if(neg && pos) continue;
    if(x < 0 || y < 0 || x >= PW || y >= PH) continue;
    const i = y * PW + x;
    if(paint){ if(g.mat[i]) g.mat[i] = mat; }
    else pset(g, x, y, mat, x + .5 < (a[0] + b[0] + c[0]) / 3 ? 0 : 1, part);
  }
}
/* цепочка кружков — хвосты, хоботы; rings — материал колец через шаг */
function pchain(g, pts, r, mat, part, rings){
  let k2 = 0;
  for(let k = 0; k < pts.length - 1; k++){
    for(let s = 0; s <= 4; s++){
      const x = pts[k][0] + (pts[k + 1][0] - pts[k][0]) * s / 4;
      const y = pts[k][1] + (pts[k + 1][1] - pts[k][1]) * s / 4;
      pell(g, x, y, r, r, rings && (k2 % 4 === 2) ? rings : mat, part);
      k2++;
    }
  }
}
function ppx(g, x, y, mat){
  x = Math.floor(x); y = Math.floor(y);
  if(x < 0 || y < 0 || x >= PW || y >= PH) return;
  g.mat[y * PW + x] = mat;
  g.tone[y * PW + x] = 1;
}
/* глаза 2×2 с бликом; закрытые — дужка */
function peyes(g, xl, xr, y, closed){
  [xl, xr].forEach(function(x){
    if(closed){ ppx(g, x - 1, y + 1, 'o'); ppx(g, x, y + 1, 'o'); }
    else { ppx(g, x, y, 'e'); ppx(g, x, y + 1, 'e'); ppx(g, x - 1, y, 'e'); ppx(g, x - 1, y + 1, 'e'); ppx(g, x - 1, y, 'w'); }
  });
}
/* румянец */
function blush(g, xl, xr, y){ ppx(g, xl, y, 'p'); ppx(g, xl + 1, y, 'p'); ppx(g, xr, y, 'p'); ppx(g, xr - 1, y, 'p'); }
/* усы — торчат за контур и сами не обводятся */
function whiskers(g, hr, y){
  const l = Math.floor(12 - hr) - 2, r = Math.ceil(12 + hr) + 1;
  ppx(g, l, y, 'k'); ppx(g, l - 1, y - 1, 'k'); ppx(g, l, y + 2, 'k'); ppx(g, l - 1, y + 2, 'k');
  ppx(g, r, y, 'k'); ppx(g, r + 1, y - 1, 'k'); ppx(g, r, y + 2, 'k'); ppx(g, r + 1, y + 2, 'k');
}
function crown(g, cx, top){
  const x0 = Math.round(cx) - 3, y0 = Math.max(0, Math.floor(top) - 2);
  ['y.yy.y', 'yyyyyy', 'yryyry'].forEach(function(r, dy){
    for(let dx = 0; dx < 6; dx++) if(r[dx] !== '.') pset(g, x0 + dx, y0 + dy, r[dx] === 'r' ? 'cr' : 'cy', dy === 0 ? 0 : (dy === 2 ? 2 : 1), 99);
  });
}
function L(t, a, b){ return a + (b - a) * t; }
/* передние лапы: часть тела, между ними — тень, внизу подушечки */
function legs(g, xl, xr, h, mat, paw, w){
  w = w || 2;
  [xl, xr].forEach(function(x){
    for(let y = 21 - h; y <= 21; y++) for(let k = 0; k < w; k++){
      pset(g, x + k, y, mat, k === w - 1 ? 2 : 1, 1);
    }
    if(paw) for(let k = 0; k < w; k++) ppx(g, x + k, 21, paw);
  });
  for(let y = 21 - h + 1; y <= 21; y++) for(let x = xl + w; x < xr; x++){
    const i = y * PW + x;
    if(g.mat[i]){ g.tone[i] = 2; }
  }
}

/* ---------- звери ---------- */
const PETS = {

  /* трёхцветная кошка — как на референсе */
  cat: {
    pal: { o:'#4A2A22', b:['#FFFFFF','#F7F2EC','#D8CCC0'], l:['#FFFFFF','#FFFFFF','#E6DDD3'],
           m:['#FFB35C','#EE8A33','#BF6120'], d:['#75594E','#4F3B34','#33241F'], p:'#F7A1AE', n:'#E8788A', t:'#F2707E' },
    draw: function(g, t, z){
      const hy = L(t, 11.4, 8.6), hr = L(t, 5.8, 5.5), hry = L(t, 5, 4.5);
      const by = L(t, 18, 16.8), bx = L(t, 4, 4.8);
      const sw = z.alt ? 1.2 : 0;
      pchain(g, [[15.5, 20.3], [18.4, 19.8], [19.8 + sw * .4, 17], [19.4 + sw, L(t, 15.2, 13.5)], [18 + sw, L(t, 14.4, 12.2)]], L(t, .85, 1.05), 'd', 0, 'm');
      pell(g, 12, by, bx, L(t, 3.6, 4.8), 'b', 1);
      pell(g, 12 - bx + 1.6, by - 1.2, 2.4, 2.2, 'm', 1, true);
      pell(g, 12 + bx - 1.2, by + 1.6, 2, 1.8, 'd', 1, true);
      pell(g, 12, by + .9, L(t, 2, 2.4), L(t, 2.6, 3.4), 'l', 1, true);
      if(z.act) legs(g, 13, 13, Math.round(L(t, 2, 3.6)), 'b', 'l'); else legs(g, 9, 13, Math.round(L(t, 2, 3.6)), 'b', 'l');
      const ear = z.alt ? .6 : 0;
      ptri(g, [12 - hr + .4, hy - .8], [12 - hr + .6 - ear, hy - hry - 2.8 + ear], [12 - 1.6, hy - hry + .7], 'm', 3);
      ptri(g, [12 + hr - .4, hy - .8], [12 + hr - .6, hy - hry - 2.8], [12 + 1.6, hy - hry + .7], 'd', 3);
      ptri(g, [12 - hr + 1.6, hy - hry + .2], [12 - hr + 1.5 - ear, hy - hry - 1.5 + ear], [12 - 2.8, hy - hry + .6], 'p', 3, true);
      ptri(g, [12 + hr - 1.6, hy - hry + .2], [12 + hr - 1.5, hy - hry - 1.5], [12 + 2.8, hy - hry + .6], 'p', 3, true);
      pell(g, 12, hy, hr, hry, 'b', 3);
      pell(g, 12 - hr + 1.6, hy - hry + 1.6, 3.4, 2.8, 'm', 3, true);
      pell(g, 12 + hr - 1.8, hy - hry + 1.4, 2.8, 2.2, 'd', 3, true);
      pell(g, 12, hy + 2.3, 2.6, 1.7, 'l', 3, true);
      peyes(g, 10, 15, hy - .1, z.sleep || z.alt || z.act);
      ppx(g, 11, hy + 1.8, 'n'); ppx(g, 12, hy + 1.8, 'n');
      ppx(g, 11, hy + 2.8, 'o'); ppx(g, 12, hy + 2.8, 'o');
      blush(g, 8, 16, hy + 2);
      whiskers(g, hr, Math.floor(hy + 1.5));
      if(z.act){
        /* моет мордочку: лапка ко рту (язычок) — к глазу — ко рту — к щеке */
        const py = hy + [2.6, .7, 2.6, 1.6][z.act - 1], px = z.act === 2 ? 9.2 : 9.8;
        pchain(g, [[9.4, by - .2], [px + .3, py + 1.2]], 1, 'm', 5);
        pell(g, px, py, 1.7, 1.6, 'm', 6);
        ppx(g, px - .4, py + .4, 'p'); ppx(g, px + .6, py + .4, 'p');
        if(z.act % 2 === 1){ ppx(g, 11.4, hy + 3.4, 't'); ppx(g, 11.4, hy + 2.8, 't'); }
      }
      return { cx: 12, top: hy - hry };
    }
  },

  /* тигрёнок: круглые уши, пушистые щёки, «брови», кольца на хвосте */
  tiger: {
    pal: { o:'#43210E', b:['#FFB764','#F58A2A','#C45F17'], l:['#FFFFFF','#FFF8F0','#E9D9CB'], d:'#2E1E26', p:'#F7A1AE', n:'#E8788A', t:'#F2707E' },
    draw: function(g, t, z){
      const rise = z.act ? [0, 1.5, 3, 3][z.act - 1] : 0;
      const hy = L(t, 11.2, 8.8) - rise, hr = L(t, 6.4, 6.3), hry = L(t, 5.2, 4.6);
      const by = L(t, 18.2, 16.8) - rise, bx = L(t, 4.4, 5.6);
      const sw = z.alt ? -1.4 : 0;
      pchain(g, [[15.8, 20.2], [18.6, 19.6], [20.2, 17.4], [20.6 + sw * .5, L(t, 15.4, 14)], [19.6 + sw, L(t, 13.8, 12)]], L(t, 1, 1.3), 'b', 0, 'd');
      const tip = [19.6 + sw, L(t, 13.8, 12)];
      pell(g, tip[0], tip[1], L(t, 1, 1.3), L(t, 1, 1.3), 'd', 0);
      pell(g, 12, by, bx, L(t, 3.6, 4.8), 'b', 1);
      pell(g, 12, by + .9, L(t, 2.2, 2.8), L(t, 2.8, 3.6), 'l', 1, true);
      [by - 1.2, by + 1.2].forEach(function(y, i){
        ppx(g, 12 - bx + .6, y, 'd'); ppx(g, 12 - bx + 1.6, y + .5, 'd');
        ppx(g, 12 + bx - .6, y, 'd'); ppx(g, 12 + bx - 1.6, y + .5, 'd');
      });
      legs(g, 8, 13, Math.round(L(t, 2, 3.6) + rise), 'b', 'l', 3);
      /* круглые уши */
      pell(g, 12 - hr + 1.4, hy - hry + .9 - (z.alt ? .5 : 0), 1.9, 1.9, 'b', 3);
      pell(g, 12 + hr - 1.4, hy - hry + .9, 1.9, 1.9, 'b', 3);
      ppx(g, 12 - hr + 1.2, hy - hry + .4 - (z.alt ? .5 : 0), 'd'); ppx(g, 12 + hr - 1.6, hy - hry + .4, 'd');

      ptri(g, [12 - hr + .8, hy + .2], [12 - hr - 1.2, hy + 2.6], [12 - hr + 2.2, hy + 3.6], 'l', 3);

};

/* ---------- рендер ---------- */
const BASE = { e:'#2A1608', w:'#FFFFFF', o:null, cy:['#FFE680','#FFC53D','#D9921A'], cr:'#0067FF' };

function prender(g, pal){
  const outline = pal.o;
  const out = new Array(PW * PH).fill(null);
  function solid(j){ return g.mat[j] && g.mat[j] !== 'k'; }
  for(let y = 0; y < PH; y++) for(let x = 0; x < PW; x++){
    const i = y * PW + x;
    const m = g.mat[i];
    if(m === 'k'){ out[i] = outline; continue; }
    if(m){
      /* внутренняя линия: сосед из более близкого слоя */
      const p = g.part[i];
      let behind = false;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        const X = x + d[0], Y = y + d[1];
        if(X < 0 || Y < 0 || X >= PW || Y >= PH) return;
        const j = Y * PW + X;
        if(solid(j) && g.part[j] > p && g.part[j] !== 99) behind = true;
      });
      if(behind && m !== 'e' && m !== 'w'){ out[i] = outline; continue; }
      const c = m === 'o' ? outline : (pal[m] || BASE[m]);
      out[i] = Array.isArray(c) ? c[g.tone[i]] : c;
    } else {
      let edge = false;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        const X = x + d[0], Y = y + d[1];
        if(X < 0 || Y < 0 || X >= PW || Y >= PH) return;
        if(solid(Y * PW + X)) edge = true;
      });
      if(edge) out[i] = outline;
    }
  }
  return out;
}

function petSVG(kind, stage, sleeping, alt, act){
  const g = pgrid();
  let pal, info;
  if(stage === 'egg'){
    pal = { o:'#6B4A3A', b:['#FFFDF6','#FFF1D6','#E8CFA5'], d:'#F2A7AE' };
    pell(g, 12, 15.5 - (alt ? .6 : 0), 5.2, 6.3, 'b', 1);
    [[10,12],[14,14],[11,17],[15,18],[13,10]].forEach(function(p){ ppx(g, p[0], p[1] - (alt ? .6 : 0), 'd'); });
  } else {
    const P = PETS[kind];
    pal = P.pal;
    const t = { baby:0, teen:.5, adult:1, legend:1 }[stage];
    info = P.draw(g, t, { sleep: sleeping, alt: !!alt && !sleeping, act: act || 0 });
    if(stage === 'legend') crown(g, info.cx, info.top);
  }
  const cols = prender(g, pal);
  let rects = '';
  for(let y = 0; y < PH; y++){
    let x = 0;
    while(x < PW){
      const c = cols[y * PW + x];
      if(!c){ x++; continue; }
      let n = 1;
      while(x + n < PW && cols[y * PW + x + n] === c) n++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + c + '"/>';
      x += n;
    }
  }
  return '<svg viewBox="0 0 24 24" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' +
    '<ellipse cx="12" cy="22.4" rx="7.5" ry="1.4" fill="rgba(60,40,40,.22)"/>' + rects + '</svg>';
}

/* живой спрайт: два кадра (обычный и «моргнул/махнул»), кадры переключает CSS */
function petAnim(kind, stage, sleeping, delay){
  if(sleeping) return petSVG(kind, stage, true);
  return '<span class="pa" style="animation-delay:' + (delay || 0) + 's">' +
    petSVG(kind, stage, false, false) + petSVG(kind, stage, false, true) + '</span>';
}

/* сценка при выборе: 4 кадра по кругу */
const ACT_DUR = { cat:1.4, dog:.7, parrot:1.3, hamster:1.8, tiger:1.6, lion:1.2, rhino:1, elephant:1.6 };
function petAct(kind, stage){
  const dur = ACT_DUR[kind] || 1.2;
  let h = '<span class="pact">';
  for(let f = 1; f <= 4; f++){
    h += petSVG(kind, stage, false, false, f).replace('<svg ', '<svg style="animation-duration:' + dur + 's;animation-delay:' + ((f - 1) * dur / 4).toFixed(3) + 's" ');
  }
  return h + '</span>';
}

/* ============================================================
   ПИТОМЦЫ СБОКУ — для движения: ходьба, нюханье, засада, прыжок,
   полёт, бег. Смотрят вправо; влево — зеркально.
   Цикл ходьбы из 4 кадров, как в Stardew Valley: лапы по очереди,
   на промежуточных кадрах тело чуть приподнимается.
   ============================================================ */

/* наклонная лапа: от бедра к ступне */
function sleg(g, x0, y0, x1, w, mat, part, paw, tone){
  for(let y = Math.floor(y0); y <= 21; y++){
    const k = (y - y0) / Math.max(1, 21 - y0);
    const x = x0 + (x1 - x0) * k;
    for(let i = 0; i < w; i++) pset(g, x + i, y, mat, i === w - 1 ? 2 : (tone || 1), part);
  }
  if(paw) for(let i = 0; i < w; i++) ppx(g, x1 + i, 21, paw);
}

/* общий четвероногий: o — особенности зверя, p — поза и кадр */
function quadSide(g, t, p, o){
  const f = p.frame || 0;
  const walking = p.pose === 'walk' || p.pose === 'crouch';
  const bob = walking && f % 2 === 1 ? -1 : 0;
  const low = p.pose === 'crouch' ? 2 : 0;
  const pounce = p.pose === 'pounce';
  const brx = L(t, 4.2, 6.2) * (o.long || 1), bry = L(t, 2.9, 3.5) * (o.fat || 1);
  const bx = 11, by = L(t, 16.4, 15.4) + bob + low - (pounce ? 3 : 0);
  const hr = L(t, 4, 3.5) * (o.headSize || 1);
  let hx = bx + brx * .82 + L(t, 1.4, 1.6), hy = by - L(t, 3.6, 4.2) + (p.pose === 'sniff' ? 4 + (f % 2) : 0) + (low ? 1.5 : 0);
  if(pounce){ hx += 1; hy += 1; }
  const legTop = by + bry * .45;
  /* шаг: смещение ступней [ближняя перед., дальняя перед., ближняя зад., дальняя зад.] */
  let sw = [[1.5, -1.5, -1.5, 1.5], [0, 0, 0, 0], [-1.5, 1.5, 1.5, -1.5], [0, 0, 0, 0]][f % 4];
  if(!walking) sw = [0, 0, 0, 0];
  if(pounce) sw = [3, 2.5, -3, -2.5];
  const fx = bx + brx * .5, bkx = bx - brx * .62, lw = o.legw || 2;
  const legH = pounce ? legTop + 1.5 : legTop;

  /* дальние лапы и хвост — позади */
  sleg(g, fx + 1, legH, fx + 1 + sw[1], lw, 'b', 0, o.paw, 2);
  sleg(g, bkx + 1, legH, bkx + 1 + sw[3], lw, 'b', 0, o.paw, 2);
  o.tail(g, bx - brx + .6, by - bry * .4, f, p);

  /* тело */
  pell(g, bx, by, brx, bry, 'b', 1);
  if(o.belly) pell(g, bx + .5, by + bry * .55, brx * .75, bry * .5, 'l', 1, true);
  if(o.body) o.body(g, bx, by, brx, bry);

  /* ближние лапы */
  sleg(g, fx, legH, fx + sw[0], lw, 'b', 2, o.paw);
  sleg(g, bkx, legH, bkx + sw[2], lw, 'b', 2, o.paw);

  /* голова */
  if(o.behindHead) o.behindHead(g, hx, hy, hr, t);
  pell(g, hx, hy, hr, hr * .92, 'b', 3);
  const sx = hx + hr * .78, sy = hy + hr * .38;
  pell(g, sx, sy, L(t, 1.5, 1.9) * (o.snout || 1), L(t, 1.2, 1.4), o.snoutMat || 'l', 3);
  ppx(g, sx + L(t, 1.2, 1.6) * (o.snout || 1), sy - .6, 'n');
  o.head(g, hx, hy, hr, t, f, p);
  /* глаз: столбик с бликом, на кадре «моргнул» — чёрточка */
  const ex = hx + hr * .28, ey = hy - hr * .22;
  if(p.blink){ ppx(g, ex, ey + 1, 'o'); ppx(g, ex + 1, ey + 1, 'o'); }
  else { ppx(g, ex, ey, 'e'); ppx(g, ex, ey + 1, 'e'); ppx(g, ex + 1, ey, 'w'); ppx(g, ex + 1, ey + 1, 'e'); }
  if(o.blush) ppx(g, ex - .5, ey + 2.2, 'p');
  return { cx: hx, top: hy - hr };
}

const SIDE = {
  dog: {
    paw: 'l',
    tail: function(g, x, y, f, p){
      const wag = p.pose === 'walk' || p.pose === 'sit' ? [0, 1.2, 0, -1.2][f % 4] : 0;
      pchain(g, [[x + .5, y], [x - 1.5, y - 2 + wag * .3], [x - 2 + wag, y - 4]], .85, 'd', 0);
    },
    body: function(g, bx, by, brx){ pell(g, bx - brx * .2, by - 1, 2.4, 1.8, 'd', 1, true); },
    head: function(g, hx, hy, hr, t, f, p){
      /* висячее ухо за глазом, ошейник, язык */
      pell(g, hx - hr * .35, hy + .4 + (p.pose === 'walk' ? (f % 2) * .5 : 0), 1.5, L(t, 2.6, 2.9), 'd', 4);
      for(let y = Math.floor(hy + hr * .75); y <= Math.floor(hy + hr * .75) + 1; y++){
        for(let x = Math.floor(hx - hr * .6); x <= Math.floor(hx + hr * .2); x++){ const i = y * PW + x; if(g.mat[i]) g.mat[i] = 'c'; }
      }
      if(p.pose === 'walk'){ ppx(g, hx + hr * .9, hy + hr * .95, 't'); ppx(g, hx + hr * .9, hy + hr * 1.3, 't'); }
    },
    belly: true, blush: true
  },
  cat: {
    paw: 'l',
    tail: function(g, x, y, f){
      const s = [0, .6, 0, -.6][f % 4];
      pchain(g, [[x + .5, y + .5], [x - 1.8, y - .5], [x - 2.6 + s, y - 3], [x - 2 + s, y - 5.5]], .8, 'd', 0, 'm');
    },
    body: function(g, bx, by, brx){ pell(g, bx - brx * .35, by - 1, 2.6, 2, 'm', 1, true); pell(g, bx + brx * .35, by - 1.2, 1.8, 1.6, 'd', 1, true); },
    head: function(g, hx, hy, hr){
      ptri(g, [hx - hr * .75, hy - hr * .35], [hx - hr * .55, hy - hr - 2.2], [hx + hr * .05, hy - hr * .7], 'm', 3);
      ptri(g, [hx - hr * .45, hy - hr * .5], [hx - hr * .5, hy - hr - 1.2], [hx - hr * .15, hy - hr * .75], 'p', 3, true);
      pell(g, hx - hr * .4, hy - hr * .3, hr * .6, hr * .55, 'm', 3, true);
      const l = Math.floor(hx + hr + 1.4), y = Math.floor(hy + hr * .35);
      ppx(g, l + 1, y - 1, 'k'); ppx(g, l + 1, y + 1, 'k');
    },
    belly: true, blush: true
  },
  tiger: {
    paw: 'l', legw: 2, fat: 1.08,
    tail: function(g, x, y, f){
      const s = [0, .7, 0, -.7][f % 4];
      pchain(g, [[x + .5, y + .5], [x - 2, y - .2], [x - 3 + s, y - 2.5], [x - 3 + s * 1.4, y - 4.6]], 1.05, 'b', 0, 'd');
      pell(g, x - 3 + s * 1.4, y - 4.8, 1, 1, 'd', 0);
    },
    body: function(g, bx, by, brx, bry){
      [-.55, -.15, .25].forEach(function(k){ const x = bx + brx * k; ppx(g, x, by - bry + .6, 'd'); ppx(g, x, by - bry + 1.6, 'd'); ppx(g, x + .6, by - bry + 2.6, 'd'); });
    },
    head: function(g, hx, hy, hr){
      pell(g, hx - hr * .5, hy - hr * .75, 1.5, 1.5, 'b', 3);
      ppx(g, hx - hr * .5, hy - hr * .95, 'd');
      ptri(g, [hx - hr * .9, hy + .2], [hx - hr - 1.3, hy + 2.2], [hx - hr * .3, hy + 2.6], 'l', 3);
      ppx(g, hx - hr * .1, hy - hr * .7, 'd'); ppx(g, hx + hr * .2, hy - hr * .55, 'd'); ppx(g, hx - hr * .55, hy + .2, 'd');
      ppx(g, hx + hr * .1, hy - hr * .55 - 1, 'l');
    },
    belly: true, blush: true
  },
  lion: {
    paw: 'l',
    tail: function(g, x, y, f){
      const s = [0, .5, 0, -.5][f % 4];
      pchain(g, [[x + .5, y + .5], [x - 2, y + .3], [x - 3.2 + s, y - 1.6]], .75, 'b', 0);
      pell(g, x - 3.6 + s, y - 2.4, 1.3, 1.4, 'm', 0);
    },
    behindHead: function(g, hx, hy, hr, t){
      if(t < .2){ return; }
      const mr = hr + L(t, 1.2, 2.2);
      for(let a = 0; a < 10; a++){
        const ang = a / 10 * Math.PI * 2;
        ptri(g, [hx - .8 + Math.cos(ang - .3) * (mr - 1.2), hy + .4 + Math.sin(ang - .3) * (mr - 1.2)],
                [hx - .8 + Math.cos(ang + .3) * (mr - 1.2), hy + .4 + Math.sin(ang + .3) * (mr - 1.2)],
                [hx - .8 + Math.cos(ang) * (mr + .9), hy + .4 + Math.sin(ang) * (mr + .9)], 'm', 2);
      }
      pell(g, hx - .8, hy + .4, mr, mr, 'm', 2);
    },
    head: function(g, hx, hy, hr, t){
      pell(g, hx - hr * .3, hy - hr * .8, 1.3, 1.3, 'b', 3);
      if(t < .2){ ppx(g, hx - hr * .1, hy - hr - .2, 'm'); ppx(g, hx + hr * .2, hy - hr + .2, 'm'); }
    },
    belly: true, blush: true
  }
};

/* попугай в полёте: крылья вверх — середина — вниз — середина */
function parrotFly(g, t, f){
  const by = 12 + [0, .5, 1, .5][f % 4];
  pchain(g, [[6, by + .5], [2.5, by + 2]], 1.1, 'q', 0);
  pchain(g, [[6.5, by + 1.2], [3, by + 3.2]], .9, 'r', 0);
  const w = [-4.5, -1, 2.5, -1][f % 4];
  ptri(g, [9, by - .5], [15, by - .5], [11 + (w < 0 ? -1 : 1), by + w - (w < 0 ? 2 : -1)], 'd', 0);
  pell(g, 10.5, by, L(t, 3.4, 4.4), L(t, 2.4, 2.8), 'b', 1);
  pell(g, 11, by + 1, L(t, 2.4, 3.2), 1.3, 'l', 1, true);
  pell(g, 15, by - 2, L(t, 3.2, 3), L(t, 3, 2.8), 'b', 3);
  pell(g, 15.6, by - 1.2, 1.8, 1.8, 'f', 3, true);
  ptri(g, [14, by - 4.6], [13.2, by - 7.2], [15.4, by - 4.8], 'r', 3);
  pell(g, 18, by - 1.4, 1.2, 1.3, 'y', 4);
  ptri(g, [9.5, by - .3], [16, by - .3], [12.5 + (w < 0 ? -1 : 1), by + w], 'd', 5);
  ppx(g, 16, by - 2.8, 'e'); ppx(g, 16, by - 1.8, 'e'); ppx(g, 17, by - 2.8, 'w');
  ppx(g, 15.4, by - .6, 'p');
  return { cx: 15, top: by - 5 };
}

/* хомяк бежит: круглое тело, лапки мелькают */
function hamsterRun(g, t, f){
  const by = 16.4 + (f % 2 ? -1 : 0);
  const sw = [[1.2, -1.2], [0, 0], [-1.2, 1.2], [0, 0]][f % 4];
  pell(g, 9, by + 1, 1.2, 1.2, 'p', 0);
  sleg(g, 13.5, by + 3, 13.5 + sw[1], 2, 'p', 0, null, 2);
  sleg(g, 8, by + 3, 8 + sw[0], 2, 'p', 0, null, 2);
  pell(g, 12, by, L(t, 5.4, 6.4), L(t, 4.4, 5), 'b', 1);
  pell(g, 13, by + 1.6, L(t, 3.6, 4.4), 2.4, 'l', 1, true);
  pell(g, 11, by - L(t, 4, 4.6), 1.5, 1.5, 'b', 0);
  ppx(g, 11, by - L(t, 4.3, 4.9), 'p');
  pell(g, 16.4, by + .6, 1.6, 1.3, 'p', 1, true);
  ppx(g, 17.6, by - .6, 'n');
  ppx(g, 15, by - 1.6, 'e'); ppx(g, 15, by - .6, 'e'); ppx(g, 16, by - 1.6, 'w'); ppx(g, 16, by - .6, 'e');
  sleg(g, 15, by + 3, 15 + sw[0], 2, 'p', 2);
  sleg(g, 10, by + 3.2, 10 + sw[1], 2, 'p', 2);
  const l = 19;
  ppx(g, l, by - .5, 'k'); ppx(g, l + 1, by - 1.5, 'k'); ppx(g, l, by + 1, 'k');
  return { cx: 12, top: by - 5 };
}

/* кадр спрайта сбоку в SVG */
const SIDE_CACHE = {};
function sideSVG(kind, stage, pose, frame, blink){
  const key = kind + stage + pose + frame + (blink ? 'b' : '');
  if(SIDE_CACHE[key]) return SIDE_CACHE[key];
  const g = pgrid();
  const P = PETS[kind];
  const t = { baby: 0, teen: .5, adult: 1, legend: 1 }[stage] || 0;
  let info;
  if(kind === 'parrot') info = parrotFly(g, t, frame);
  else if(kind === 'hamster') info = hamsterRun(g, t, frame);
  else info = quadSide(g, t, { pose: pose, frame: frame, blink: blink }, SIDE[kind] || SIDE.dog);
  if(stage === 'legend') crown(g, info.cx, info.top);
  const cols = prender(g, P.pal);
  let rects = '';
  for(let y = 0; y < PH; y++){
    let x = 0;
    while(x < PW){
      const c = cols[y * PW + x];
      if(!c){ x++; continue; }
      let n = 1;
      while(x + n < PW && cols[y * PW + x + n] === c) n++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + c + '"/>';
      x += n;
    }
  }
  const shadow = kind === 'parrot' ? '' : '<ellipse cx="12" cy="22.4" rx="7" ry="1.3" fill="rgba(60,40,40,.22)"/>';
  const svg = '<svg viewBox="0 0 24 24" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' + shadow + rects + '</svg>';
  SIDE_CACHE[key] = svg;
  return svg;
}

/* ============================================================
   БОЛЬШИЕ ПИКСЕЛЬНЫЕ ПРЕДМЕТЫ СЦЕНОК — лужа, пруд, колесо, окно, дверь.
   Рисуются клетками того же размера, что и пиксель питомца,
   чтобы всё в кадре было одной «зернистости».
   ============================================================ */

function pixSVG(W, H, cell, outline, draw){
  const m = [];
  for(let y = 0; y < H; y++) m.push(new Array(W).fill(null));
  draw(function(x, y, c){ x = Math.floor(x); y = Math.floor(y); if(x >= 0 && y >= 0 && x < W && y < H) m[y][x] = c; }, m);
  const out = m.map(function(r){ return r.slice(); });
  if(outline) for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(m[y][x]) continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(function(d){ const X = x + d[0], Y = y + d[1]; return X >= 0 && Y >= 0 && X < W && Y < H && m[Y][X]; })) out[y][x] = outline;
  }
  let rects = '';
  for(let y = 0; y < H; y++){
    let x = 0;
    while(x < W){
      const c = out[y][x];
      if(!c){ x++; continue; }
      let n = 1;
      while(x + n < W && out[y][x + n] === c) n++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + c + '"/>';
      x += n;
    }
  }
  return '<svg width="' + W * cell + '" height="' + H * cell + '" viewBox="0 0 ' + W + ' ' + H + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' + rects + '</svg>';
}

/* лужа грязи или вода: плоский овал со светлым краем, тенью и бликами */
function puddleSVG(W, H, cell, water){
  const C = water ? { top:'#9FDCFF', base:'#6FC3F5', low:'#3A8FD0', spark:'#FFFFFF', o:'#2E6FA8' }
                  : { top:'#B07A48', base:'#8A5A2E', low:'#6B4222', spark:'#C99A6A', o:'#3A2410' };
  return pixSVG(W + 2, H + 2, cell, C.o, function(set){
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
      const nx = (x + .5 - W / 2) / (W / 2), ny = (y + .5 - H / 2) / (H / 2);
      if(nx * nx + ny * ny > 1) continue;
      let c = C.base;
      if(ny < -.45) c = C.top;
      if(ny > .5) c = C.low;
      if((x * 7 + y * 13) % 23 === 0 && ny > -.4 && ny < .4) c = C.spark;
      set(x + 1, y + 1, c);
    }
  });
}

/* колесо хомяка: обод, спицы под углом (кадры вращения), подставка */
function wheelSVG(R, cell, frame){
  const S = R * 2 + 6, c = S / 2 - 1.5;
  return pixSVG(S, S + 4, cell, '#1B3566', function(set){
    for(let y = 0; y < S; y++) for(let x = 0; x < S; x++){
      const d = Math.hypot(x + .5 - c, y + .5 - c);
      if(d <= R && d > R - 2.2) set(x, y, d > R - 1 ? '#3A7AD8' : '#6FA8FF');
    }
    const a0 = frame * Math.PI / 6;
    for(let k = 0; k < 4; k++){
      const a = a0 + k * Math.PI / 2;
      for(let r = 1.5; r < R - 2; r += .5) set(c + Math.cos(a) * r, c + Math.sin(a) * r, '#9CC3FF');
    }
    set(c, c, '#1B3566'); set(c - 1, c, '#1B3566');
    for(let y = Math.floor(c + R * .6); y < S + 3; y++){ set(c - R * .45 - (y - c) * .12, y, '#C98A4A'); set(c + R * .45 + (y - c) * .12, y, '#C98A4A'); }
  });
}

/* окно с подоконником */
function windowSVG(cell){
  const W = 26, H = 19;
  return pixSVG(W, H, cell, '#6F8FC0', function(set){
    for(let y = 0; y < 16; y++) for(let x = 1; x < 25; x++){
      const frame = x <= 2 || x >= 22 || y <= 1 || y >= 14 || (x >= 12 && x <= 13) || (y >= 7 && y <= 8);
      set(x, y, frame ? '#FFFFFF' : (y < 4 ? '#E6F6FF' : (y < 11 ? '#BFE6FF' : '#9FD4FF')));
    }
    [[4, 3], [5, 3], [4, 4], [15, 3], [16, 3], [15, 4]].forEach(function(p){ set(p[0], p[1], '#FFFFFF'); });
    for(let x = 0; x < W; x++){ set(x, 16, '#E1E8F3'); set(x, 17, '#C9D6EA'); }
  });
}

/* дверь с филёнками и ручкой */
function doorSVG(cell){
  const W = 14, H = 23;
  return pixSVG(W, H, cell, '#3A2410', function(set){
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
      const edge = x === 0 || x === W - 1 || y === 0;
      const panel = x >= 3 && x <= 10 && ((y >= 3 && y <= 9) || (y >= 12 && y <= 20));
      const rim = panel && (x === 3 || y === 3 || y === 12);
      set(x, y, edge ? '#6B4222' : (rim ? '#7A4E2A' : (panel ? '#B07A48' : '#9A6538')));
    }
    set(11, 11, '#FFD84A'); set(11, 12, '#E8A820');
  });
}

/* капля и пузырёк — маленькие, той же зернистости */
function dropSVG(cell){
  return pixSVG(5, 6, cell, '#2E6FA8', function(set){ set(2, 1, '#9FDCFF'); set(1, 2, '#6FC3F5'); set(2, 2, '#DFF3FF'); set(3, 2, '#6FC3F5'); set(1, 3, '#6FC3F5'); set(2, 3, '#6FC3F5'); set(3, 3, '#3A8FD0'); set(2, 4, '#3A8FD0'); });
}
function bubbleSVG(cell){
  return pixSVG(5, 5, cell, '#3A2410', function(set){ set(1, 1, '#B07A48'); set(2, 1, '#8A5A2E'); set(3, 1, '#8A5A2E'); set(1, 2, '#8A5A2E'); set(2, 2, '#8A5A2E'); set(3, 2, '#6B4222'); set(2, 3, '#6B4222'); });
}

/* маленькие игрушки: мячик, клубок, колокольчик, семечка — 5×5 клеток */
function toySVG(kind, cell){
  const C = { ball:['#D8F04A', '#B0C830', '#FFFFFF', '#4A5A10'], yarn:['#FF9EC4', '#E86AA0', '#FFD0E2', '#6B2A4A'],
              bell:['#FFD84A', '#E8A820', '#FFF6C0', '#7A5210'], seed:['#6A6972', '#4A4950', '#F2F2F2', '#232228'] }[kind] || ['#ccc', '#999', '#fff', '#333'];
  return pixSVG(7, 7, cell, C[3], function(set){
    for(let y = 0; y < 5; y++) for(let x = 0; x < 5; x++){
      const d = Math.hypot(x - 2, y - 2);
      if(d > 2.4) continue;
      set(x + 1, y + 1, x + y >= 5 ? C[1] : C[0]);
    }
    set(2, 2, C[2]);
    if(kind === 'ball'){ set(2, 4, C[2]); set(3, 5, C[2]); }
    if(kind === 'yarn'){ set(3, 2, C[1]); set(4, 3, C[1]); set(5, 4, C[1]); set(6, 5, C[1]); }
    if(kind === 'bell'){ set(3, 0, C[1]); set(3, 6, C[3]); }
    if(kind === 'seed'){ set(3, 3, C[2]); set(3, 4, C[2]); }
  });
}

  '🛁':'tub','💧':'drop','🧶':'yarn','🎾':'ball','💬':'chat','🧩':'puzzle','📜':'scroll','💪':'bolt','💦':'drop',
  '🩹':'bandage','✅':'check','🥚':'egg','📅':'calendar','↪️':'calendar','🍂':'leaf','✨':'sparkle','⬆️':'up',
  '💭':'think','🎉':'cake','🔔':'bell','📔':'book','📋':'clip','⏩':'fast'
};

function iconSVG(name, size, bottom){
  const I = ICONS[name] || ICONS[EMOJI_ICON[name]];
  if(!I) return name ? '<span class="ico-t">' + name + '</span>' : '';
  const W = 14, H = I.rows.length + 2;
  const fill = [];
  for(let y = 0; y < H; y++){ fill.push(new Array(W).fill(null)); }
  I.rows.forEach(function(r, y){
    for(let x = 0; x < 12; x++){ const ch = r[x]; if(ch && ch !== '.') fill[y + 1][x + 1] = I.pal[ch] || '#f0f'; }
  });
  const out = [];
  for(let y = 0; y < H; y++){
    out.push([]);
    for(let x = 0; x < W; x++){
      let c = fill[y][x];
      if(!c){
        const n = [[1,0],[-1,0],[0,1],[0,-1]].some(function(d){ const X = x + d[0], Y = y + d[1]; return X >= 0 && Y >= 0 && X < W && Y < H && fill[Y][X]; });
        if(n) c = I.o;
      }
      out[y].push(c);
    }
  }
  let rects = '';
  for(let y = 0; y < H; y++){
    let x = 0;
    while(x < W){
      const c = out[y][x];
      if(!c){ x++; continue; }
      let n = 1;
      while(x + n < W && out[y][x + n] === c) n++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + c + '"/>';
      x += n;
    }
  }
  const pad = bottom ? 14 - H : (14 - H) / 2;
  const s = size ? ' width="' + size + '" height="' + size + '"' : '';
  return '<svg class="ico" viewBox="0 ' + (-pad) + ' 14 14"' + s + ' shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' + rects + '</svg>';
}

}

/* варианты нового времени для переноса: ближайшие дни, утро и после обеда */
function moveSlots(w){
  const out = [];
  const base = new Date(state.now);
  for(let d = 1; out.length < 6 && d < 8; d++){
    const day = new Date(base.getFullYear(), base.getMonth(), base.getDate() + d);
    if(day.getDay() === 0 || day.getDay() === 6) continue;
    [11, 15].forEach(function(h){
      const at = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, 0, 0, 0).getTime();
      if(at !== w.at && out.length < 6) out.push(at);
    });
  }
  return out;
}

const ACTOR_SCRIPTS = {
  walk:      [['walk', 80], ['stand', 8], ['sniff', 16], ['walk', -20], ['walk', -80], ['sit', 18], ['walk', 10], ['stand', 6]],
  walkslow:  [['walk', 75, .55], ['stand', 16], ['sit', 14], ['walk', -75, .55], ['stand', 12]],
  hunt:      [['crouch', -10, .45], ['wiggle', 10], ['pounce', 60], ['stand', 14], ['walk', -80], ['stand', 8]],
  lurk:      [['hold', 10], ['wiggle', 6]],
  undersill: [['walk', 30], ['stand', 10], ['sit', 16], ['walk', -50], ['stand', 10]],
  fly:       [['fly', 9999]],
  wheel:     [['run', 9999]]
};
const ACTOR_TICK = 110;
const actor = { key: null, i: 0, x: -80, y: 0, dir: 1, tick: 0, left: 0, from: 0 };

function actorPose(){ const sc = sceneNow(); return sc && ACTOR_SCRIPTS[sc.pose] ? sc.pose : null; }
function actorReset(pose){
  actor.key = state.kind + pose; actor.i = 0; actor.tick = 0; actor.y = 0; actor.dir = 1;
  actor.x = { hunt: -80, walk: -80, walkslow: -80, undersill: -50, lurk: -20 }[pose] || 0;
  actorStart();
}
function actorStart(){
  const step = ACTOR_SCRIPTS[actorPose()][actor.i];
  actor.left = typeof step[1] === 'number' ? step[1] : 0;
  actor.from = actor.x;
}
function actorNext(){
  const script = ACTOR_SCRIPTS[actorPose()];
  actor.i = (actor.i + 1) % script.length;
  actorStart();
}
/* один тик: сдвинуть и выбрать кадр */
function actorStep(){
  const pose = actorPose();
  if(!pose){ actor.key = null; return; }
  if(actor.key !== state.kind + pose) actorReset(pose);
  actor.tick++;
  const step = ACTOR_SCRIPTS[pose][actor.i];
  const kind = step[0];
  if(kind === 'walk' || kind === 'crouch' || kind === 'pounce'){
    const speed = (step[2] || 1) * (kind === 'pounce' ? 9 : 4);
    const dx = step[1] - actor.x;
    actor.dir = dx >= 0 ? 1 : -1;
    if(Math.abs(dx) <= speed){ actor.x = step[1]; actor.y = 0; actorNext(); }
    else {
      actor.x += speed * actor.dir;
      if(kind === 'pounce'){
        const k = (actor.x - actor.from) / (step[1] - actor.from || 1);
        actor.y = -Math.sin(Math.max(0, Math.min(1, k)) * Math.PI) * 46;
      }
    }
  } else if(kind === 'fly'){
    const a = actor.tick / 16;
    const nx = Math.sin(a) * 88;
    actor.dir = Math.cos(a) >= 0 ? 1 : -1;
    actor.x = nx;
    actor.y = -Math.abs(Math.sin(a * 2)) * 34;
  } else if(kind !== 'run'){
    actor.left--;
    if(actor.left <= 0) actorNext();
  }
}
/* нарисовать текущий кадр в #actor */
function actorDraw(){
  const el = document.getElementById('actor');
  const pose = actorPose();
  if(!el || !pose) return;
  if(actor.key !== state.kind + pose) actorReset(pose);
  const step = ACTOR_SCRIPTS[pose][actor.i];
  const st = stage(), k = state.kind, f = actor.tick % 4;
  let svg, front = false;
  switch(step[0]){
    case 'walk':   svg = sideSVG(k, st, 'walk', f); break;
    case 'crouch': svg = sideSVG(k, st, 'crouch', Math.floor(actor.tick / 2) % 4); break;
    case 'wiggle': svg = sideSVG(k, st, 'crouch', actor.tick % 2 ? 0 : 2); break;
    case 'hold':   svg = sideSVG(k, st, 'crouch', 0, actor.tick % 9 === 0); break;
    case 'pounce': svg = sideSVG(k, st, 'pounce', 0); break;
    case 'sniff':  svg = sideSVG(k, st, 'sniff', Math.floor(actor.tick / 3) % 2); break;
    case 'stand':  svg = sideSVG(k, st, 'stand', 0, actor.tick % 12 === 0); break;
    case 'sit':    svg = petSVG(k, st, false, false, Math.floor(actor.tick / 2) % 4 + 1); front = true; break;
    case 'fly':
    case 'run':    svg = sideSVG(k, st, 'walk', f); break;
  }
  const px = Math.round(actor.x / 3) * 3, py = Math.round(actor.y / 3) * 3;
  el.style.transform = 'translate(' + px + 'px,' + py + 'px)';
  el.innerHTML = '<div style="width:100%;height:100%;transform:scaleX(' + (front ? 1 : actor.dir) + ')">' + svg + '</div>';
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function need(level){ return level <= 0 ? 10 : 30 + level * 15; }
function pet(){ return ANIMALS[state.kind] || ANIMALS.cat; }
function stage(){ return stageOf(state.level); }

function nextItem(kind){
  const list = TASKS[kind];

  state.used[kind]++;
  return list[i];
}
function pickFrom(list, key){

/* начисление опыта с переходами уровней; возвращает список событий роста */
function gainXp(amount){
  const ups = [];
  state.totalXp += amount;
  state.xp += amount;
  while(state.xp >= need(state.level)){
    state.xp -= need(state.level);
    const before = stage();
    state.level++;
    const after = stage();
    ups.push({ level: state.level, stageChanged: before !== after, stage: after });
    if(after === 'teen') addItem('teen');
    if(after === 'adult') addItem('adult');
    if(after === 'legend') addItem('legend');
  }
  return ups;
}

function feedOne(id){
  const i = state.bowl.findIndex(function(b){ return b.id === id; });
  if(i === -1) return null;
  const f = state.bowl.splice(i, 1)[0];
  const r = REWARDS[f.type];
  const wasEgg = state.level === 0;
  state.fullness = clamp(state.fullness + r.food, 0, 100);
  if(f.type === 'report' || f.type === 'milestone') state.joy = clamp(state.joy + 12, 0, 100);
  const ups = gainXp(r.xp);
  if(wasEgg) addItem('hatch');
  if(f.type === 'milestone') addItem(f.item);
  if(f.type === 'report'){ addItem('first_report'); inc('reportsRead'); }
  if(f.type === 'small' || f.type === 'medium' || f.type === 'large') inc('fed');
  if(f.type === 'large') inc('largeFed');
  addDiary({ kind: f.type, icon: foodEmoji(f.type), title: f.title, sub: r.kind + ' · ' + (f.type === 'report' ? 'прочитано' : 'съедено'), xp: r.xp });
  ups.forEach(function(u){
    addDiary({ kind:'level', icon: u.stageChanged ? '✨' : '⬆️',
      title: u.stageChanged ? (state.name + ': новая стадия — ' + STAGE_LABEL[u.stage].toLowerCase()) : ('Уровень ' + u.level),
      sub: 'Рост питомца' });
  });
  return { food: f, ups: ups, hatched: wasEgg };
}

function fire(ev){
  if(!state.kind){
    flashNote('Сначала выберите питомца в приложении — пульт заработает после онбординга.');
    return;
  }
  const p = pet();
  if(ev === 'small' || ev === 'medium' || ev === 'large'){
    const t = nextItem(ev);
    state.bowl.push({ id: state.seq++, type: ev, title: t[0], text: t[1] });
    state.counts.tasks++;
    if(ev === 'large') state.counts.large++;
    logConsole('Задача закрыта: ' + t[0]);
    notify({ type:'feed', icon: foodEmoji(ev),
      title: voice(p.sound + ' ' + fl().feed, 'Задача выполнена'),
      body: t[0] });
  }
  else if(ev === 'milestone'){
    const i = state.used.milestone % TASKS.milestone.length;
    const m = nextItem('milestone');
    state.bowl.push({ id: state.seq++, type: 'milestone', title: m[0], text: 'Цель проекта достигнута. За это — праздничный торт и новый предмет в комнату.', item: 'ms' + i });
    logConsole('Веха: ' + m[0]);
    notify({ type:'feed', icon:'🎂', title: voice(fl().party, 'Достигнута цель проекта'), body: m[0] });
  }
  else if(ev === 'report'){
    const d = new Date(state.now);
    const month = MONTHS_NOM[(d.getMonth() + 11) % 12];
    state.bowl.push({ id: state.seq++, type: 'report', title: 'Отчёт за ' + month,
      text: 'Главное за месяц — коротко. Полный отчёт в PDF лежит в кабинете.', month: month,
      stats: { tasks: Math.max(3, state.counts.tasks), large: state.counts.large, vis: 8 + (state.counts.tasks * 3) % 17, leads: 5 + (state.counts.tasks * 7) % 21 } });
    state.counts.reports++;
    logConsole('Отправлен отчёт за ' + month);
    notify({ type:'feed', icon:'📰', title: voice(fl().report, 'Готов ежемесячный отчёт'), body: 'Отчёт за ' + month });
  }
  else if(ev === 'walk'){
    const m = pickFrom(MEETINGS, 'walk');
    const when = new Date(state.now + DAY * (1 + state.walks.length % 3));
    when.setHours(state.walks.length % 2 ? 11 : 15, 0, 0, 0);
    const w = { id: state.seq++, title: m[0], sub: m[1], at: when.getTime(), status: 'pending' };
    state.walks.push(w);
    logConsole('Назначена встреча: ' + m[0]);
    notify({ type:'walk', icon: fl().walk.icon, ref: w.id, title: voice(p.sound + ' ' + fl().walk.call, 'Назначена встреча'),
      body: m[0] + ' · ' + fmtDay(w.at) + ', ' + fmtTime(w.at) });
  }
  else if(ev === 'request'){
    const reqIdx = state.used.request % REQUESTS.length;
    const r = pickFrom(REQUESTS, 'request');
    const q = { id: state.seq++, title: r.title, text: r.text, status: 'open', ref: reqIdx };
    state.requests.push(q);
    logConsole('Запрос клиенту: ' + r.title);
    notify({ type:'request', icon: fl().play.icon, ref: q.id, title: voice(fl().play.call, 'Нужно ваше решение'), body: r.title + ' · ' + r.hint });
  }
  else if(ev === 'incident'){
    if(state.incident){
      const done = state.incident;
      state.incident = null;
      inc('resolved');
      addDiary({ kind:'incident', icon:'✅', title: 'Исправлено: ' + done.title, sub: 'Инцидент закрыт' });
      logConsole('Инцидент закрыт');
      notify({ type:'incident', icon:'✅', title: voice('Всё починили, можно выдохнуть', 'Инцидент устранён'), body: done.title });
    } else {
      const r = pickFrom(INCIDENTS, 'incident');
      state.incident = { title: r[0], text: r[1], at: state.now };
      addDiary({ kind:'incident', icon:'🩹', title: r[0], sub: 'Команда уже разбирается' });
      logConsole('Инцидент: ' + r[0]);
      notify({ type:'incident', icon:'🩹', title: voice(fl().oops, 'Инцидент на сайте'), body: r[0] });
    }
  }
  else if(ev === 'meet'){
    /* встреча по шагам: за 30 минут → началась → закончилась */
    const w = meetTarget();
    if(!w){ flashNote('Сначала назначьте встречу — кнопка «Назначить встречу» выше.'); return; }
    const sc = SCENES[state.kind];
    if(!state.scene){
      state.scene = { phase:'pre', id: w.id };
      state.now = w.at - 30 * 60000;
      logConsole('Через 30 минут встреча: ' + w.title);
      notify({ type:'walk', icon: fl().walk.icon, ref: w.id, title: voice(p.sound + ' ' + sc.pre.text, 'Встреча через 30 минут'),
        body: w.title + ' · в ' + fmtTime(w.at) });
    } else if(state.scene.phase === 'pre'){
      state.scene.phase = 'walk';
      state.now = w.at;
      if(w.status === 'pending') w.status = 'confirmed';
      logConsole('Встреча началась: ' + w.title);
      notify({ type:'walk', icon: fl().walk.icon, ref: w.id, title: voice(sc.walk.text, 'Встреча началась'), body: w.title });
    } else {
      state.scene = null;
      state.now = w.at + 60 * 60000;
      w.status = 'done';
      state.joy = clamp(state.joy + 15, 0, 100);
      addItem('first_walk');
      inc('walksDone');
      addDiary({ kind:'walk', icon: fl().walk.icon, title: fl().walk.done + ': ' + w.title, sub: 'Встреча состоялась · «' + meetLine(2) + '»', t: w.at });
      logConsole('Встреча прошла: ' + w.title);
      petFx = 'happy';
      clearFxLater(1100);
      petSay(meetLine(2));
    }
  }
  else if(ev === 'week'){
    state.scene = null;
    inc('weeks');
    state.now += DAY * 7;
    let walked = 0;
    state.walks.forEach(function(w){
      if(w.at <= state.now && w.status !== 'done' && w.status !== 'moved'){
        if(w.status === 'confirmed'){
          w.status = 'done';
          walked++;
          state.joy = clamp(state.joy + 15, 0, 100);
          addItem('first_walk');
          inc('walksDone');
          addDiary({ kind:'walk', icon: fl().walk.icon, title: fl().walk.done + ': ' + w.title, sub: 'Встреча состоялась', t: w.at });
        } else {
          w.status = 'missed';
          addDiary({ kind:'walk', icon:'🍂', title: 'Не состоялось: ' + w.title, sub: 'Встреча не была подтверждена', t: w.at });
        }
      }
    });
    state.fullness = clamp(state.fullness - 18, 30, 100);
    state.joy = clamp(state.joy - 12, 30, 100);
    logConsole('Прошла неделя' + (walked ? ', встреч: ' + walked : ''));
    if(state.joy < 45) notify({ type:'home', icon:'💭', title: voice(fl().bored, 'Давно не заходили в проект'), body: 'Погладь питомца или ответь команде' });
  }
  save();
  renderAll();
}

function doFeed(id){
  const res = feedOne(id);
  if(!res) return;
  sheet = null;
  const grow = res.ups.some(function(u){ return u.stageChanged; }) || res.hatched;
  petFx = grow ? 'grow' : 'act';
  const ms = grow ? 1600 : eatShow();
  save();
  renderAll();
  burstFood(foodEmoji(res.food.type));
  floatFx('+' + REWARDS[res.food.type].xp + ' XP', 'xp');
  if(res.ups.length){
    const last = res.ups[res.ups.length - 1];
    setTimeout(function(){
      sheet = { type:'levelup', level: last.level, hatched: res.hatched, stageChanged: res.ups.some(function(u){ return u.stageChanged; }) };
      renderSheets();
    }, grow ? 900 : ms);
  }
  clearFxLater(ms);
}

function doPet(){
  if(!state.kind || state.level === 0) return;
  state.joy = clamp(state.joy + 4, 0, 100);
  inc('pets');
  petFx = 'happy';
  reaction = fl().petted;
  save();
  renderAll();
  floatFx('❤', 'heart');
  clearFxLater(1100);
}

function clearFxLater(ms){
  clearTimeout(clearFxLater.t);
  clearFxLater.t = setTimeout(function(){ petFx = null; if(Date.now() >= petSay.until) reaction = null; renderAll(); }, ms);
}

/* питомец что-то говорит: пузырь над ним на главном экране,
   а на остальных экранах — всплывающая реплика с питомцем */
function petSay(text, ms){
  ms = ms || 4200;
  reaction = text;
  petSay.until = Date.now() + ms;
  clearTimeout(petSay.t);
  petSay.t = setTimeout(function(){ reaction = null; sayEl.classList.remove('show'); renderAll(); }, ms);
  if(state.view === 'phone' && state.screen !== 'home' && !state.strict){
    sayEl.innerHTML = '<span class="say-pet">' + petSVG(state.kind, stage(), false) + '</span><span class="say-text">' + esc(text) + '</span>';
    sayEl.classList.add('show');
  }
}
petSay.until = 0;

/* после еды: своя сценка (кошка умывается, хомяк прячет за щёку…) и реплика */
let reaction = null;
function eatShow(){
  reaction = fl().eat[state.diary.length % fl().eat.length];
  return Math.round((ACT_DUR[state.kind] || 1.2) * 2000);
}

function answerWalk(id, action){
  const w = state.walks.find(function(x){ return x.id === id; });
  if(!w) return;
  if(action === 'ok'){
    w.status = 'confirmed';
    state.joy = clamp(state.joy + 6, 0, 100);
    addDiary({ kind:'walk', icon:'📅', title: 'Встреча подтверждена: ' + w.title, sub: fmtDay(w.at) + ', ' + fmtTime(w.at) + ' · «' + meetLine(0) + '»' });
    logConsole('Клиент подтвердил встречу: ' + w.title);
    petSay(meetLine(0));
  } else {
    /* action — новое время (метка времени) */
    w.at = action;
    w.status = 'confirmed';
    if(state.scene && state.scene.id === w.id) state.scene = null;
    inc('moved');
    addDiary({ kind:'walk', icon:'📅', title: 'Встреча перенесена: ' + w.title, sub: 'Новое время: ' + fmtDay(w.at) + ', ' + fmtTime(w.at) + ' · «' + meetLine(1) + '»' });
    logConsole('Клиент перенёс встречу на ' + fmtDay(w.at) + ', ' + fmtTime(w.at));
    petSay(meetLine(1) + ' — до ' + fmtDay(w.at));
  }
  sheet = null;
  petFx = 'happy';
  save();
  renderAll();
  floatFx('❤', 'heart');
  clearFxLater(1100);
}

function answerRequest(id, action, pick){
  const q = state.requests.find(function(x){ return x.id === id; });
  if(!q) return;
  const edits = action === 'ok' ? null : action;   /* правки: { picks:[...], note:'' } */
  const R = reqData(q) || {};
  q.status = edits ? 'changes' : 'done';
  q.answer = edits ? 'Отправлены правки' : (pick ? 'Выбран вариант ' + pick : (R.ok || 'Согласовано'));
  if(pick){ q.choice = pick; inc('chosen'); }
  const summary = edits ? edits.picks.concat(edits.note ? ['«' + edits.note + '»'] : []).join(', ') : '';
  if(edits){ q.edits = edits; inc('edits'); logConsole('Клиент прислал правки: ' + q.title + ' — ' + summary); }
  else logConsole('Клиент ответил: ' + q.title + ' — ' + q.answer.toLowerCase());
  petSay((ANSWER_LINES[state.kind] || ANSWER_LINES.dog)[edits ? 0 : 1]);
  state.counts.answered++;
  if(state.counts.answered >= 3) addItem('helper');
  state.joy = clamp(state.joy + 15, 0, 100);
  const ups = gainXp(10);
  addDiary({ kind:'request', icon: edits ? '📋' : '✅', title: q.title, sub: edits ? 'Ваши правки: ' + summary : 'Ваш ответ: ' + q.answer.toLowerCase(), xp: 10 });
  sheet = null;
  petFx = 'happy';
  save();
  renderAll();
  floatFx('+10 XP', 'xp');
  if(ups.length){
    setTimeout(function(){
      sheet = { type:'levelup', level: ups[ups.length - 1].level, stageChanged: ups.some(function(u){ return u.stageChanged; }) };
      renderSheets();
    }, 900);
  }
  clearFxLater(2600);
}

function openNotif(nid){
  const n = state.notifs.find(function(x){ return String(x.id) === String(nid); });
  pushEl.classList.remove('show');
  state.unread = 0;
  if(!n){ renderAll(); return; }
  if(n.type === 'feed'){
    state.screen = 'home';
    if(state.bowl.length) sheet = { type:'feed' };
  } else if(n.type === 'walk'){
    state.screen = 'walks';
    const w = state.walks.find(function(x){ return x.id === n.ref; });
    if(w && w.status === 'pending') sheet = { type:'walk', id: w.id };
  } else if(n.type === 'request'){
    state.screen = 'home';
    const q = state.requests.find(function(x){ return x.id === n.ref; });
    if(q && q.status === 'open') sheet = { type:'request', id: q.id };
  } else if(n.type === 'trophy'){
    state.screen = 'collection';
  } else if(n.type === 'incident'){
    state.screen = 'home';
    if(state.incident) sheet = { type:'incident' };
  } else {
    state.screen = 'home';
  }
  save();
  renderAll();
}

function meterRow(key, label, pct, valText){
  return '<div class="stat-row"><span class="lab">' + label + '</span>' +
    '<div class="meter ' + key + '"><span data-bar="' + key + '" data-w="' + pct + '"></span></div>' +
    '<span class="val">' + valText + '</span></div>';
}

function statsBlock(){
  const xpPct = state.level === 0 ? 0 : Math.round(state.xp / need(state.level) * 100);
  return meterRow('xp', 'До ур. ' + (state.level + 1), xpPct, state.xp + '/' + need(state.level)) +
         meterRow('food', 'Сытость', state.fullness, state.fullness + '%') +
         meterRow('joy', 'Радость', state.joy, state.joy + '%');
}

function petLine(){
  if(state.strict) return '';
  if(reaction) return reaction;
  if(sceneNow()) return sceneNow().text;
  const p = pet();
  if(state.level === 0) return state.bowl.length ? 'Тук-тук! Покорми — и я вылуплюсь' : 'Тук-тук… Жду первую выполненную задачу';
  if(state.incident) return 'Что-то случилось, но команда уже чинит. Я рядом';
  if(state.bowl.length) return p.sound + ' В миске что-то есть! ' + (state.bowl.length > 1 ? 'Целых ' + state.bowl.length + ' порции' : '');
  const openReq = state.requests.find(function(q){ return q.status === 'open'; });
  if(openReq) return fl().play.line;
  const pend = state.walks.find(function(w){ return w.status === 'pending'; });
  if(pend) return fl().walk.line;
  if(isSleeping()) return 'Проголодался и прилёг вздремнуть… Команда скоро что-нибудь принесёт';
  if(isBored()) return fl().bored;
  const idle = ['Сегодня команда работает над сайтом', 'Расту вместе с проектом!', 'Загляни в дневник — там всё, что сделали', p.sound + ' Хорошо, что заглянул'];
  return idle[state.diary.length % idle.length];
}

function petClass(){
  if(petFx) return petFx;
  if(isSleeping()) return 'sleep';
  if(isBored()) return 'bored';
  return 'idle';
}

function applyBars(root){
  root.querySelectorAll('[data-bar]').forEach(function(el){
    const key = el.dataset.bar;
    const target = parseFloat(el.dataset.w);
    const from = prevW[key] == null ? target : prevW[key];
    el.style.transition = 'none';
    el.style.width = from + '%';
    void el.offsetWidth;
    el.style.transition = '';
    el.style.width = target + '%';
    prevW[key] = target;
  });
}

function groupByDay(list){

  list.forEach(function(e){
    const d = fmtDay(e.t);

    out.push(e);
  });
  return out;
}
